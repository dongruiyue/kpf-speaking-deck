<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>示例课 PET · 阅读习惯 · Speaking 课堂工具</title>
<style>
:root{
  --console-w:352px;
  --ref-w:340px;
  --paper:#FAF9F5; --card:#FFFFFF; --line:#E8E4DA;
  --ink:#2E2E2C; --dim:#6B6760; --terra-ink:#B4472C;
  --teal:#2C786C; --terra:#D96C4F; --mustard:#E0A82E;
  --green:#6BCB77; --coral:#FF8A5C;
  --teal-soft:#E4EFEC; --terra-soft:#F9E8E2; --mustard-soft:#FBF2DC;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:none;}
body{background:var(--paper);color:var(--ink);min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;transition:transform .12s ease-out;}
button:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

header{display:flex;align-items:center;gap:14px;padding:8px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap;}
header h1{font-size:17px;font-weight:800;}
header .sub{font-size:11.5px;color:var(--dim);margin-top:1px;}
.score-mini{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:5px 12px;font-weight:800;font-size:15px;margin-left:auto;}
.score-mini .dotA,.score-mini .dotB{width:12px;height:12px;border-radius:4px;display:inline-block;}
.dotA{background:var(--teal);} .dotB{background:var(--terra);}
.score-mini b{font-size:18px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums;}
.hdr-right{display:flex;gap:8px;}
.icon-btn{width:40px;height:40px;border-radius:11px;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;color:var(--teal);}
.icon-btn:hover{background:var(--teal-soft);}
.icon-btn svg{width:24px;height:24px;}
#miniTimer{position:absolute;bottom:1px;right:5px;font-size:11px;color:var(--terra-ink);font-variant-numeric:tabular-nums;display:none;font-weight:800;}
#miniTimer.on{display:block;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.35}}

.steps{display:flex;gap:8px;padding:8px 20px;overflow-x:auto;}
.step{flex:1;min-width:120px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12.5px;color:var(--dim);text-align:left;display:flex;align-items:center;gap:7px;}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;flex-shrink:0;}
.step.cur{border-color:var(--teal);color:var(--ink);}
.step.cur .n{background:var(--teal);color:#fff;border-color:var(--teal);}
.step.done .n{background:var(--green);color:#fff;border-color:var(--green);}
.step.bonus{background:var(--mustard-soft);}

main{padding:6px 22px 34px;max-width:min(1780px,98vw);margin:0 auto;}
body.presenting main,body.ref-open main{padding-bottom:64px;}
/* 演讲者控制台 / 参考抽屉都是真正的栏，各自占位，绝不覆盖左侧内容 */
body.presenting,body.ref-open{display:grid;grid-template-rows:auto auto 1fr;align-items:start;}
body.presenting{grid-template-columns:1fr var(--console-w);}
body.ref-open{grid-template-columns:1fr var(--ref-w);}
body.presenting.ref-open{grid-template-columns:1fr var(--ref-w) var(--console-w);}
body.presenting header,body.ref-open header{grid-column:1;grid-row:1;}
body.presenting .steps,body.ref-open .steps{grid-column:1;grid-row:2;}
body.presenting main,body.ref-open main{grid-column:1;grid-row:3;margin-right:0;max-width:none;width:100%;}
.screen{display:none;}
.screen.on{display:block;animation:fade .25s ease-out;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

.dash-title{font-size:24px;font-weight:800;margin:12px 0 3px;}
.dash-sub{color:var(--dim);margin-bottom:12px;font-size:13.5px;line-height:1.6;}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.menu-card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:left;min-height:104px;display:flex;flex-direction:column;gap:6px;position:relative;}
.menu-card:hover{border-color:var(--teal);transform:translateY(-3px);box-shadow:0 8px 20px rgba(44,120,108,.1);}
.menu-card .ic{width:46px;height:46px;color:var(--teal);display:inline-block;}
.menu-card .ic svg{width:100%;height:100%;}
.menu-card .t{font-size:21px;font-weight:800;}
.menu-card .d{font-size:14px;color:var(--dim);line-height:1.5;}
.menu-card .time{margin-top:auto;font-size:12px;color:var(--terra);font-weight:700;}
.menu-card .tier{position:absolute;top:18px;right:18px;font-size:12px;font-weight:800;border-radius:10px;padding:4px 10px;}
.tier.core{background:var(--teal-soft);color:var(--teal);}
.tier.warm{background:#E9EEF0;color:#5c6b70;}
.tier.bonus{background:var(--mustard-soft);color:#7a5b10;}
.menu-card.champ{background:var(--mustard-soft);border-color:var(--mustard);}
.menu-card.champ .ic{color:var(--mustard);}

.topline{display:flex;align-items:center;gap:12px;margin:9px 0 9px;flex-wrap:wrap;}
.back-btn{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--dim);}
.back-btn:hover{color:var(--ink);}
.topline h2{font-size:22px;font-weight:800;}
.teacher-tip{width:100%;background:var(--teal-soft);border:1.5px solid #cfe3de;border-radius:14px;text-align:left;}
.teacher-tip summary{cursor:pointer;color:var(--teal);font-size:14px;font-weight:800;padding:9px 14px;list-style:none;}
.teacher-tip summary::before{content:"教学提示（学生不可见）· 点击展开";}
.teacher-tip[open] summary::before{content:"教学提示 · 点击收起";}
.teacher-tip .tip-body{padding:0 16px 11px;font-size:13px;line-height:1.75;color:#3c5a53;}
.teacher-tip .tip-body b{color:var(--teal);}

.stage{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:clamp(9px,1.1vw,14px);text-align:center;min-height:clamp(150px,20vh,240px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.mega-btn{border-radius:14px;padding:12px 26px;font-size:clamp(16px,1.6vw,22px);font-weight:800;color:#fff;background:var(--teal);min-height:52px;box-shadow:0 4px 14px rgba(44,120,108,.25);display:inline-flex;align-items:center;gap:8px;flex-shrink:0;}
.mega-btn.terra{background:var(--terra);box-shadow:0 4px 14px rgba(217,108,79,.25);}
.mega-btn.mustard{background:var(--mustard);color:var(--ink);box-shadow:0 4px 14px rgba(224,168,46,.3);}
.mega-btn svg{width:20px;height:20px;}
.ghost-btn{background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 16px;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:7px;flex-shrink:0;}
.ghost-btn:hover{border-color:var(--teal);color:var(--teal);}
.ghost-btn svg{width:17px;height:17px;}
.big-sub{font-size:clamp(13px,1.25vw,16px);color:var(--dim);}
.sentence{background:var(--mustard-soft);border:2px dashed var(--mustard);border-radius:14px;padding:9px 15px;font-size:clamp(14px,1.35vw,17px);color:#7a5b10;max-width:900px;line-height:1.45;}
.rule-line{font-size:clamp(12.5px,1.1vw,14px);color:var(--dim);font-weight:700;}
.badge{display:inline-block;font-size:clamp(15px,2vw,19px);padding:6px 18px;border-radius:20px;font-weight:800;}
.badge.like{background:#E3F4E8;color:#3a8a4d;}
.badge.dislike{background:var(--terra-soft);color:var(--terra-ink);}
.next-row{width:100%;display:flex;justify-content:flex-end;align-items:center;margin-top:auto;padding-top:4px;flex-wrap:wrap;gap:10px;}

.score-team{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.score-team button{border-radius:14px;padding:8px 16px;font-size:clamp(13.5px,1.25vw,16px);font-weight:900;border:1.5px solid;min-height:40px;}
.score-team button.a{color:var(--teal);border-color:var(--teal);background:var(--card);}
.score-team button.a:hover{background:var(--teal-soft);}
.score-team button.b{color:var(--terra-ink);border-color:var(--terra-ink);background:var(--card);}
.score-team button.b:hover{background:var(--terra-soft);}
.turn-label{font-size:clamp(15px,1.5vw,19px);font-weight:900;}

.champ-score{display:flex;gap:22px;align-items:center;width:100%;max-width:760px;}
.champ-score .side{flex:1;background:var(--paper);border:3px solid;border-radius:20px;padding:24px;}
.champ-score .side.a{border-color:var(--teal);}
.champ-score .side.b{border-color:var(--terra);}
.champ-score .cs{font-size:clamp(56px,9vw,96px);font-weight:900;font-variant-numeric:tabular-nums;}
.champ-score .side.a .cs{color:var(--teal);}
.champ-score .side.b .cs{color:var(--terra);}
.champ-score .cn{font-size:clamp(19px,2.6vw,26px);font-weight:900;}
.score-table{width:100%;max-width:660px;border-collapse:collapse;font-size:clamp(15px,2.2vw,22px);}
.score-table th,.score-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;}
.score-table th{color:var(--dim);font-weight:800;}
.score-table td.step{text-align:left;font-weight:700;}
.score-table .a{color:var(--teal);font-weight:900;}
.score-table .b{color:var(--terra-ink);font-weight:900;}
.win-banner{font-size:clamp(26px,4.5vw,44px);font-weight:900;color:var(--teal);}
.vs{font-size:clamp(20px,3vw,30px);font-weight:900;color:var(--dim);}

#timerOverlay{position:fixed;inset:0;background:rgba(250,249,245,.94);display:none;align-items:center;justify-content:center;z-index:100;}
.timer-card{background:var(--card);border:2px solid var(--teal);border-radius:28px;padding:36px 44px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 20px 60px rgba(44,120,108,.22);max-width:92vw;}
.timer-num{font-size:clamp(84px,16vw,170px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--teal);}
.timer-num.warn{color:var(--coral);animation:pulse .5s infinite;}
.presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.presets button{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:13px 20px;font-size:16px;}
.presets button:hover{border-color:var(--teal);}
.timer-ctrl{display:flex;gap:12px;}
.timer-ctrl button{border-radius:14px;padding:15px 32px;font-size:18px;font-weight:800;min-height:58px;}
#tClose{position:absolute;top:20px;right:26px;font-size:34px;color:var(--dim);}
#tEnd{display:none;flex-direction:column;align-items:center;gap:20px;}

#console{position:fixed;top:0;right:0;bottom:0;width:var(--console-w);background:var(--card);border-left:1.5px solid var(--line);z-index:80;display:none;flex-direction:column;padding:18px;gap:14px;overflow-y:auto;}
body.presenting #console{display:flex;grid-column:2;grid-row:1/4;position:static;height:100vh;width:100%;}
#console .c-title{font-size:13px;color:var(--dim);font-weight:800;letter-spacing:1px;}
#console .c-screen{font-size:21px;font-weight:900;}
#console .c-box{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:14px;line-height:1.8;}
#console .c-box b{color:var(--teal);}
#console .talk-line{margin:10px 0 12px;}
#console .talk-en{display:block;font-size:15px;font-weight:800;color:var(--ink);line-height:1.5;}
#console .talk-cn{display:block;font-size:12px;color:var(--dim);margin-top:3px;}
#console .c-nav{display:flex;gap:8px;}
#console .c-nav button{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-weight:800;background:var(--card);min-height:48px;}
#console .c-nav button:hover{border-color:var(--teal);color:var(--teal);}
#console .c-status{border-radius:12px;padding:10px 14px;font-size:14px;font-weight:800;text-align:center;}
#console .c-status.ok{background:#E3F4E8;color:#3a8a4d;}
#console .c-status.bad{background:var(--terra-soft);color:var(--terra);}
#console .c-status.wait{background:var(--mustard-soft);color:#7a5b10;}
#consoleExit{background:var(--ink);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800;}

/* ---------- 常驻句架栏 ---------- */
#frameBar{position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--card);border-top:2px solid var(--teal);display:flex;align-items:center;gap:18px;padding:10px 22px;flex-wrap:wrap;justify-content:center;}
#frameBar .fb-item{font-size:clamp(14px,1.9vw,19px);font-weight:800;color:var(--teal);white-space:nowrap;}
#frameBar .fb-cn{font-size:12px;color:var(--dim);font-weight:700;}
body.presenting #frameBar,body.ref-open #frameBar{padding:7px 14px;gap:12px;flex-wrap:nowrap;overflow:hidden;}
body.presenting #frameBar .fb-item,body.ref-open #frameBar .fb-item{font-size:13px;}
body.presenting #frameBar .fb-cn,body.ref-open #frameBar .fb-cn{display:none;}
body.presenting #frameBar{right:var(--console-w);}

#refBtn{color:var(--teal);}
#refDrawer{display:none;flex-direction:column;background:var(--card);border-left:1.5px solid var(--line);overflow:hidden;}
#refDrawer.on{display:flex;grid-column:2;grid-row:1/4;position:static;height:100vh;width:100%;border-radius:0;box-shadow:none;border-left:1.5px solid var(--line);border-right:none;}
body.presenting.ref-open #refDrawer{grid-column:2;}
body.presenting.ref-open #console{grid-column:3;}
body.presenting.ref-open #frameBar{right:calc(var(--ref-w) + var(--console-w));}
body.ref-open:not(.presenting) #frameBar{right:var(--ref-w);}
#refDrawer .rd-head{display:flex;gap:8px;padding:12px 14px;border-bottom:1.5px solid var(--line);align-items:center;}
#refDrawer .rd-head button.tab{border-radius:12px;padding:10px 18px;font-size:15px;font-weight:800;background:var(--paper);border:1.5px solid var(--line);color:var(--dim);}
#refDrawer .rd-head button.tab.cur{background:var(--teal);color:#fff;border-color:var(--teal);}
#refDrawer .rd-close{margin-left:auto;font-size:22px;color:var(--dim);padding:4px 10px;}
#refDrawer .rd-body{overflow-y:auto;padding:14px 18px;font-size:15px;line-height:1.8;text-align:left;}
#refDrawer .rd-body h4{color:var(--teal);font-size:15px;margin:10px 0 4px;}
#refDrawer .rd-body h4:first-child{margin-top:0;}
#refDrawer .rd-body .place-head{display:flex;align-items:center;gap:8px;color:var(--teal);font-weight:900;font-size:16px;margin:12px 0 4px;}
#refDrawer .rd-body .place-head .pic{display:inline-block;width:40px;height:40px;border-radius:8px;overflow:hidden;}
#refDrawer .rd-body .mapbox{margin-top:14px;}
#refDrawer .rd-body .mapbox img{width:100%;border-radius:12px;border:1.5px solid var(--line);}
#refDrawer .rd-body .credit{font-size:12px;color:var(--dim);margin-top:10px;}
#refDrawer .rd-body .place-head .pic svg{width:100%;height:100%;}
#refDrawer .rd-body ul{margin-left:20px;}
#refDrawer .rd-body li{margin-bottom:2px;}
#refDrawer .rd-body .pos{color:#3a8a4d;}
#refDrawer .rd-body .neg{color:var(--terra);}
#refDrawer .rd-body b{color:var(--teal);}
.reason-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:middle;}
.reason-dot.d-like{background:var(--green);}
.reason-dot.d-dislike{background:var(--coral);}

#audBadge{position:fixed;bottom:66px;left:14px;background:var(--ink);color:#fff;border-radius:10px;padding:6px 14px;font-size:12px;opacity:.6;display:none;z-index:60;}
body.audience #audBadge{display:block;}
body.audience .teacher-only{display:none!important;}
body.audience .rule-line{display:none;}
body.audience #frameBar .fb-cn{display:none;}
body.audience main{padding:6px clamp(20px,2.2vw,72px) 80px;max-width:none;width:100%;}
/* 投影要占满整屏：字号跟着屏宽放大，别让内容挤在中间一条 */
body.audience .topline h2{font-size:clamp(24px,2.3vw,44px);}
body.audience .kv{font-size:clamp(14px,1.3vw,28px);}
body.audience .recipe{padding:clamp(14px,1.5vw,26px) clamp(20px,2.2vw,44px);}
body.audience .recipe-badge{width:clamp(78px,6.4vw,124px);height:clamp(78px,6.4vw,124px);font-size:clamp(28px,2.6vw,48px);}
body.audience .recipe-list li{font-size:clamp(19px,2vw,40px);}
body.audience .badge.like{font-size:clamp(14px,1.35vw,26px);}
body.audience .rule-line{font-size:clamp(15px,1.35vw,26px);}
body.audience .dash-title{font-size:clamp(28px,2.3vw,44px);}
body.audience .menu{grid-template-columns:repeat(auto-fit,minmax(clamp(260px,22vw,420px),1fr));}
body.audience .menu-card{min-height:clamp(130px,16vh,250px);}
body.audience .menu-card .ic{width:clamp(46px,3.2vw,70px);height:clamp(46px,3.2vw,70px);}
body.audience .menu-card .t{font-size:clamp(20px,1.5vw,32px);}
body.audience .menu-card .d{font-size:clamp(14px,1.15vw,22px);}
body.audience .menu-card .time{font-size:clamp(12px,1vw,19px);}
/* 观众屏：计时器收成右上角倒计时条，不遮挡任务内容 */
body.audience #timerOverlay{background:transparent;align-items:flex-start;justify-content:flex-end;pointer-events:none!important;}
body.audience .timer-card{position:fixed;top:76px;right:20px;padding:12px 20px;gap:6px;border-width:3px;}
body.audience .timer-card .presets,body.audience #tCtrl,body.audience #tClose{display:none;}
body.audience .timer-num{font-size:clamp(44px,6.5vw,76px);}
body.audience #tEnd .mega-btn{display:none;}
body.audience #tEnd .win-banner{font-size:clamp(20px,3vw,30px);}
body.audience button,body.audience input,body.audience textarea,body.audience label,body.audience summary{pointer-events:none!important;}
#byeOverlay{position:fixed;inset:0;background:rgba(46,46,44,.9);color:#fff;display:none;align-items:center;justify-content:center;font-size:32px;font-weight:900;z-index:300;}
body.bye #byeOverlay{display:flex;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:200;display:none;}
.hint{color:var(--dim);font-size:14px;}

/* ---------- 讲解 / 练习 双视图（每个 Part 先讲后练） ---------- */
.mod-tabs{display:flex;gap:9px;margin:0 0 9px;flex-wrap:wrap;}
.mod-tab{border-radius:12px;padding:9px 18px;font-size:clamp(14px,1.25vw,16px);font-weight:800;border:1.5px solid var(--line);background:var(--card);color:var(--dim);min-height:42px;}
.mod-tab.cur{background:var(--teal);color:#fff;border-color:var(--teal);}
.mod-view{display:none;}
.mod-view.on{display:block;animation:fade .2s ease-out;}
.teach-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;flex-wrap:wrap;width:100%;}
/* ---------- 编号操作卡：整行横条，一眼就能当「照着做」的清单 ---------- */
.recipe{display:flex;align-items:center;gap:clamp(11px,1.1vw,18px);width:100%;background:var(--mustard-soft);border:2px dashed var(--mustard);border-radius:18px;padding:clamp(8px,.85vw,12px) clamp(12px,1.2vw,20px);margin-bottom:9px;text-align:left;}
.recipe-badge{flex-shrink:0;width:clamp(54px,4.4vw,76px);height:clamp(54px,4.4vw,76px);border-radius:50%;background:var(--mustard);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(19px,1.7vw,27px);font-weight:900;letter-spacing:.5px;box-shadow:0 4px 14px rgba(224,168,46,.35);}
.recipe-list{list-style:decimal;margin-left:clamp(18px,1.5vw,26px);display:flex;flex-direction:column;gap:clamp(2px,.35vw,5px);}
.recipe-list li{font-size:clamp(15px,1.4vw,21px);font-weight:800;color:#6d5010;line-height:1.35;}
.recipe-list li::marker{color:var(--mustard);font-weight:900;}
.recipe-list li b{color:var(--terra-ink);}
.recipe-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:3px;}
.recipe-row .recipe{padding:clamp(8px,.85vw,12px) clamp(11px,1vw,15px);}
.recipe-row .recipe-list li{font-size:clamp(14px,1.2vw,17px);}
.recipe-row .recipe-badge{width:clamp(48px,3.6vw,62px);height:clamp(48px,3.6vw,62px);font-size:clamp(17px,1.35vw,22px);}
/* 观众屏只显示「现在在讲解还是练习」的状态条，不是按钮 */
body.audience .mod-tabs{justify-content:center;}
body.audience .mod-tab:not(.cur){display:none!important;}
body.audience .mod-tab.cur{background:var(--paper);color:var(--teal);border-color:var(--line);box-shadow:none;cursor:default;}
.kv{display:flex;align-items:baseline;gap:8px;padding:3.5px 0;border-bottom:1px solid var(--line);font-size:clamp(11.5px,1.02vw,12.5px);line-height:1.36;}
.kv:last-child{border-bottom:none;}
.kv-k{font-weight:900;color:var(--teal);white-space:nowrap;}
.kv-v{flex:1;}
.kv-t{color:var(--dim);font-size:.88em;white-space:nowrap;}

/* ================= Speaking Part 2 练习模块 ================= */
/* 题目条：照片上方那句问题 */
.q-bar{width:100%;max-width:1000px;background:var(--mustard-soft);border:2px dashed var(--mustard);border-radius:14px;padding:7px 13px;font-size:clamp(13px,1.3vw,16px);font-weight:800;color:#7a5b10;line-height:1.35;}
.q-bar .q-tag{display:block;font-size:10px;letter-spacing:1px;color:var(--terra-ink);font-weight:900;margin-bottom:1px;text-transform:uppercase;}
.q-bar.dim{background:var(--paper);border-style:solid;border-color:var(--line);color:var(--dim);font-weight:700;}

/* 照片：两张并排 / 单张 */
.photo-pair{display:flex;gap:14px;justify-content:center;align-items:flex-start;width:100%;}
.photo-pair .ph{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:center;}
.photo-pair.sm{gap:18px;}
.photo-pair.sm .ph{flex:0 1 auto;max-width:min(196px,21vw);}
.photo-pair img{width:100%;border-radius:14px;border:1.5px solid var(--line);display:block;}
.photo-pair .ph-tag{font-size:clamp(11px,1vw,12.5px);font-weight:800;color:var(--dim);}

/* 句型卡：p1 抽题快答的加一句卡 */

/* 真题演练（p2 练习页） */
.task-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;width:100%;}
.task-btn{border-radius:12px;padding:8px 14px;font-size:clamp(12.5px,1.15vw,14px);font-weight:800;border:1.5px solid var(--line);background:var(--card);color:var(--dim);min-height:36px;}
.task-btn:hover{border-color:var(--teal);color:var(--teal);}
.task-btn.cur{background:var(--teal);color:#fff;border-color:var(--teal);}
.check-item{border-radius:12px;padding:9px 14px;font-size:clamp(12.5px,1.15vw,14px);font-weight:800;border:1.5px solid var(--line);background:var(--card);color:var(--dim);min-height:38px;}
.check-item:hover{border-color:var(--teal);color:var(--teal);}
.check-item.on{background:#E3F4E8;border-color:var(--green);color:#2f7a41;}
.check-item.on::before{content:"✓ ";font-weight:900;}

/* 撤销按钮（每个练习底部） */
.score-add{display:flex;align-items:center;gap:8px;margin-right:auto;font-size:12.5px;color:var(--dim);font-weight:800;flex-wrap:wrap;}
.score-add button{border:1.5px solid var(--line);border-radius:11px;padding:8px 12px;font-size:12.5px;font-weight:800;background:var(--card);min-height:36px;}
.score-add button:hover{border-color:var(--terra);color:var(--terra-ink);}

/* 演讲者模式左侧那块和投影是同一份内容，用同一套大字号；否则按 0.8 缩放后老师自己屏幕上只剩 10px，看不清。
   代价是内容变高，所以下面的缩放下限放宽到 0.55（见 fitLeft）。 */
body.presenting .dash-title{font-size:clamp(28px,2.3vw,44px);}
body.presenting .kv{font-size:clamp(14px,1.3vw,28px);}
body.presenting .recipe-list li{font-size:clamp(19px,2vw,40px);}
/* 观众屏：练习模块跟着屏宽放大 */
body.audience .q-bar{max-width:none;font-size:clamp(17px,1.7vw,34px);}
body.audience .photo-pair.sm .ph{max-width:min(400px,30vw);}
body.audience .photo-pair.sm{gap:26px;}
body.audience .task-btn,body.audience .check-item{font-size:clamp(15px,1.4vw,26px);min-height:clamp(58px,7vh,96px);}
body.audience .turn-label{font-size:clamp(21px,2.1vw,40px);}

/* ================= 讲解分页讲义（一个 Part = 一个模块，模块里翻页讲） =================
   一页只放一块内容，字号大、行距松，投影上一眼看完；底部翻页，翻页同步到观众屏。 */
.lesson-deck{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:clamp(10px,1.1vw,20px);text-align:left;display:flex;flex-direction:column;gap:10px;}
.deck-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:8px;}
.deck-title{font-size:clamp(19px,1.95vw,34px);font-weight:900;color:var(--teal);line-height:1.2;}
.deck-no{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--teal);color:#fff;font-size:.7em;font-weight:900;margin-right:.4em;vertical-align:middle;}
.deck-top .deck-ind{margin-left:auto;font-size:clamp(15px,1.45vw,26px);font-weight:900;color:var(--dim);font-variant-numeric:tabular-nums;}
.deck-body{min-height:clamp(180px,22vh,360px);}
.deck-page{display:none;}
.deck-page.on{display:block;}
.deck-foot{display:flex;align-items:center;gap:clamp(10px,1.4vw,26px);justify-content:center;border-top:1.5px dashed var(--line);padding-top:10px;}
.deck-nav{font-size:clamp(15px,1.5vw,25px);font-weight:900;padding:10px 26px;min-height:clamp(48px,5.5vh,72px);border-width:2px;border-radius:14px;}
.deck-nav[disabled]{opacity:.32;cursor:default;}
.deck-ind-b{font-size:clamp(16px,1.55vw,27px);font-weight:900;color:var(--teal);font-variant-numeric:tabular-nums;min-width:3.6em;text-align:center;}
.lesson-deck .dk-h{font-size:clamp(15px,1.4vw,25px);font-weight:900;color:var(--terra-ink);margin:9px 0 5px;line-height:1.3;}
.lesson-deck .dk-h:first-child{margin-top:0;}
.lesson-deck .dk-i{font-size:clamp(20px,2.2vw,36px);font-weight:800;line-height:1.34;color:var(--ink);}
.lesson-deck .dk-i b{color:var(--teal);}
.lesson-deck .dk-mA{font-size:clamp(19px,1.95vw,32px);font-weight:700;line-height:1.5;color:var(--ink);}
.lesson-deck .dk-mA b{color:var(--teal);}
.lesson-deck .dk-do{font-size:clamp(16px,1.5vw,27px);font-weight:800;line-height:1.4;color:var(--ink);}
.lesson-deck .dk-cn{font-size:clamp(13px,1.15vw,21px);color:var(--dim);font-weight:700;line-height:1.5;}
.lesson-deck .dk-blk{border-bottom:1.5px dashed var(--line);padding:1px 0 4px;}
.lesson-deck .dk-blk:last-child{border-bottom:none;}
.lesson-deck .dk-blk .dk-h{margin-top:0;}
.deck-steps{display:flex;flex-direction:column;gap:7px;margin:6px 0 2px;}
.deck-steps .dk-step{display:flex;align-items:flex-start;gap:12px;}
.deck-steps .dk-n{flex-shrink:0;width:1.75em;height:1.75em;border-radius:50%;background:var(--teal-soft);color:var(--teal);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,1.4vw,25px);}
.deck-time{display:flex;gap:8px;flex-wrap:wrap;margin:7px 0 2px;}
.deck-time span{background:var(--mustard-soft);border:1.5px solid var(--mustard);border-radius:11px;padding:5px 13px;font-size:clamp(14px,1.3vw,24px);font-weight:800;color:#7a5b10;}
.deck-time span b{color:var(--terra-ink);}
.deck-keytips{display:flex;flex-direction:column;gap:6px;}
.deck-keytips .dk-tip{display:flex;gap:12px;align-items:baseline;background:var(--teal-soft);border-radius:13px;padding:7px 14px;}
.deck-keytips .dk-tn{flex-shrink:0;font-weight:900;color:var(--teal);font-size:clamp(15px,1.4vw,25px);}
.deck-keytips .dk-te{display:block;font-size:clamp(17px,1.75vw,29px);font-weight:800;line-height:1.32;}
.deck-keytips .dk-tc{display:block;font-size:clamp(13px,1.1vw,19px);color:var(--dim);font-weight:700;margin-top:2px;}
.deck-tips-list{list-style:decimal;margin-left:clamp(18px,1.5vw,26px);display:flex;flex-direction:column;gap:6px;}
.deck-tips-list li{font-size:clamp(16px,1.5vw,27px);font-weight:700;line-height:1.4;}
.deck-tips-list li b{color:var(--teal);}
.deck-tips-list li .tip-cn{display:block;font-size:clamp(13px,1.15vw,20px);color:var(--dim);font-weight:700;margin-top:3px;}
.lesson-deck .deck-quote{background:var(--teal-soft);border-radius:14px;padding:10px 15px;}
.lesson-deck .deck-anno{background:var(--mustard-soft);border-radius:13px;padding:7px 14px;margin-top:6px;}
.lesson-deck .deck-anno .dk-ae{font-size:clamp(14px,1.3vw,24px);font-weight:800;color:#7a5b10;line-height:1.35;}
.lesson-deck .deck-anno .dk-ae i{color:var(--terra-ink);}
.lesson-deck .deck-anno .dk-ai{font-size:clamp(13px,1.2vw,22px);color:var(--terra-ink);font-weight:800;margin-top:3px;}
/* 讲义页上的操作卡：投影上要放大 */
.lesson-deck .recipe-list li{font-size:clamp(17px,1.7vw,28px);}
body.presenting .lesson-deck .recipe-list li{font-size:clamp(19px,2vw,38px);}
body.audience .lesson-deck .recipe-list li{font-size:clamp(19px,2vw,40px);}
body.audience .lesson-deck .recipe-badge{width:clamp(78px,6.4vw,124px);height:clamp(78px,6.4vw,124px);font-size:clamp(28px,2.6vw,48px);}

/* ============ 练习页常驻脚手架：按操作卡三步分组，每一步下面直接挂该步的句型 ============ */
/* 三步组件里的句架（.stepcard，见文件末尾） */
.scf-i{font-size:clamp(18px,2vw,32px);font-weight:800;line-height:1.35;color:var(--ink);}
.scf-i b{color:var(--terra-ink);}
body.audience .scf-i{font-size:clamp(20px,2.2vw,40px);}
body.audience .st-row{padding-bottom:clamp(4px,.5vw,7px);}
/* 练习页的题目也要大字 */
.q-bar{font-size:clamp(15px,1.55vw,24px);}

/* 观众屏讲义：正文 ≥20px（1920 下正文 40px × 自适应缩放） */
body.audience .lesson-deck{padding:clamp(14px,1.4vw,28px);}
body.audience .deck-title{font-size:clamp(23px,2.25vw,46px);}
body.audience .deck-top .deck-ind{font-size:clamp(18px,1.7vw,32px);}
body.audience .deck-ind-b{font-size:clamp(18px,1.7vw,32px);}
body.audience .deck-nav{font-size:clamp(17px,1.6vw,28px);padding:12px 32px;}
body.audience .lesson-deck .dk-h{font-size:clamp(17px,1.55vw,30px);}
body.audience .lesson-deck .dk-i{font-size:clamp(22px,2.3vw,40px);}
body.audience .lesson-deck .dk-mA{font-size:clamp(21px,2.15vw,36px);}
body.audience .lesson-deck .dk-do{font-size:clamp(19px,1.9vw,34px);}
body.audience .lesson-deck .dk-cn{font-size:clamp(15px,1.3vw,24px);}
body.audience .deck-steps .dk-n{font-size:clamp(17px,1.55vw,28px);}
body.audience .deck-keytips .dk-te{font-size:clamp(19px,1.9vw,34px);}
body.audience .deck-keytips .dk-tc{font-size:clamp(15px,1.3vw,24px);}
body.audience .deck-time span{font-size:clamp(18px,1.85vw,34px);}
body.audience .deck-tips-list li{font-size:clamp(20px,2.2vw,40px);}
body.audience .deck-tips-list li .tip-cn{font-size:clamp(15px,1.4vw,26px);}
body.audience .lesson-deck .deck-anno .dk-ae{font-size:clamp(18px,1.8vw,34px);}
body.audience .lesson-deck .deck-anno .dk-ai{font-size:clamp(15px,1.4vw,25px);}
/* 讲义在演讲者模式下不再套用旧的「放大字号」：讲义本身已经是大字号，再放大只会把页面撑高，
   而教师端左栏是等比缩放的 —— 页面越高、整场缩放被压得越低，反而更看不清。 */
body.presenting .lesson-deck .recipe-list li{font-size:clamp(17px,1.7vw,28px);}
body.presenting .lesson-deck .kv{font-size:clamp(12px,1.05vw,18px);}

/* ============ 总览第 2 页：四维度 × 5 分 + 中文解释 + 描述符细项（对齐呈现，一维度一块） ============ */
.lesson-deck .dk-cn b{color:var(--teal);}
.ov-note{margin:-4px 0 6px;}
.ov-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 22px;align-items:start;}
.ov-two > .deck-quote{margin:0;}
.ov-dims{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;width:100%;}
.ov-dim{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:8px 13px;display:flex;flex-direction:column;gap:3px;text-align:left;}
.ov-dim:first-child{border-color:var(--teal);}
.ov-name{font-size:clamp(16px,1.5vw,27px);font-weight:900;color:var(--teal);line-height:1.25;}
.ov-score{display:inline-block;margin-left:9px;background:var(--mustard-soft);border:1.5px solid var(--mustard);color:#7a5b10;border-radius:9px;padding:1px 10px;font-size:clamp(13px,1.15vw,20px);font-weight:900;vertical-align:middle;white-space:nowrap;}
.ov-cn{font-size:clamp(12.5px,1.1vw,20px);font-weight:800;color:var(--terra-ink);line-height:1.35;}
.ov-q{font-size:clamp(12.5px,1.1vw,20px);font-weight:700;color:var(--dim);line-height:1.45;}
.ov-q b{color:var(--teal);}
.ov-list{list-style:none;display:flex;flex-direction:column;gap:3px;margin-top:2px;}
.ov-list li{font-size:clamp(12.5px,1.1vw,20px);line-height:1.35;padding-left:16px;position:relative;font-weight:600;}
.ov-list li::before{content:"·";position:absolute;left:4px;color:var(--teal);font-weight:900;}
.ov-list li b{color:var(--teal);}
.ov-foot{margin-top:9px;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:7px 12px;line-height:1.6;}
body.audience .ov-dims{gap:12px 20px;}
body.audience .ov-dim{padding:12px 18px;}
body.audience .ov-name{font-size:clamp(19px,1.85vw,34px);}
body.audience .ov-score{font-size:clamp(16px,1.5vw,28px);}
body.audience .ov-cn{font-size:clamp(15px,1.35vw,26px);}
body.audience .ov-q{font-size:clamp(15px,1.35vw,26px);}
body.audience .ov-list li{font-size:clamp(15px,1.4vw,27px);}
body.audience .ov-foot{font-size:clamp(15px,1.35vw,26px);}

/* ============ 投影高度预算：所有屏幕都要落进同一套自适应缩放里 ============
   观众屏/演讲者模式只给整场一个缩放值，取的是「所有屏幕里最高的那一屏」。所以想让投影字号整体变大，
   必须让每一屏都变矮，同时保证投影上的实际字号（计算值 × 缩放）≥22px。下面这几条就是这个平衡点。 */
body.audience .lesson-deck .recipe-list li{font-size:clamp(19px,2vw,34px);}
body.audience .lesson-deck .recipe-row .recipe-list li{font-size:clamp(18px,1.75vw,30px);}   /* 总览两张卡并排，字号收一档才不撑高整页 */
body.audience .deck-tips-list li{font-size:clamp(19px,2vw,34px);}
body.audience .deck-keytips .dk-te{font-size:clamp(19px,1.8vw,34px);}
body.audience .lesson-deck .dk-do{font-size:clamp(18px,1.8vw,34px);}
body.audience .deck-time span{font-size:clamp(17px,1.8vw,34px);}
body.audience .lesson-deck .kv{font-size:clamp(15px,1.7vw,34px);}
body.audience .ov-cn{font-size:clamp(15px,1.5vw,30px);}
body.audience .ov-q{font-size:clamp(16px,1.7vw,34px);}
body.audience .ov-list li{font-size:clamp(16px,1.7vw,33px);}
body.audience .lesson-deck .ov-foot{font-size:clamp(16px,1.7vw,32px);}
body.audience .scf-i{line-height:1.22;}
body.audience .task-btn,body.audience .check-item{min-height:clamp(50px,5.6vh,74px);}
/* 观众屏底部留白收到刚好让开常驻句架栏（原来 80px 是重复预留，白白吃掉可用高度） */
body.audience main{padding-bottom:56px;}
/* 练习页的两处正文再收一档，让「照片 + 三步脚手架」这一屏完整落在 1080 内 */
body.audience .recipe-list li{font-size:clamp(19px,2vw,36px);}
body.audience .q-bar{font-size:clamp(16px,1.55vw,31px);}
body.audience .stage{gap:6px;}
/* 行距 / 内边距再收一档：投影上字号不变，只是把每屏的实际高度压进 1080 */
.lesson-deck .dk-i{line-height:1.30;}
body.audience .ov-dims{gap:8px 16px;}
body.audience .ov-dim{padding:9px 15px;}
body.audience .ov-list{gap:2px;}
body.audience .ov-list li{line-height:1.28;}
/* 讲义页上下内边距再收一档（每页都省，页数多、积少成多） */
body.audience .lesson-deck{padding:clamp(12px,1.2vw,20px);}
body.audience .deck-top{padding-bottom:5px;}
body.audience .deck-foot{padding-top:6px;}

/* ============ 练习页：操作卡 + 三步脚手架 + 打勾 合并成一个组件 ============
   原来「60s 操作卡（三步）」「三步脚手架（同样三步 + 句架）」「三步检查表」是三份重复内容，
   现在合成一块：标题 = 操作卡原话，内容 = 该步该用的句型，右侧打勾 = 这一步做到了。
   省下来的高度全部给照片 —— 这个环节的素材就是两张照片，看不清就没法比较。 */
.stepcard{width:100%;background:var(--mustard-soft);border:2px dashed var(--mustard);border-radius:18px;padding:clamp(8px,.9vw,14px) clamp(12px,1.2vw,20px);display:flex;flex-direction:column;gap:clamp(6px,.7vw,10px);text-align:left;}
.st-row{display:flex;flex-direction:column;gap:clamp(2px,.3vw,5px);border-bottom:1.5px dashed rgba(224,168,46,.65);padding-bottom:clamp(5px,.6vw,9px);}
.st-row:last-child{border-bottom:none;padding-bottom:0;}
.st-head{display:flex;align-items:center;gap:clamp(8px,.9vw,14px);}
.st-badge{flex-shrink:0;width:clamp(46px,3.6vw,62px);height:clamp(46px,3.6vw,62px);border-radius:50%;background:var(--mustard);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,1.35vw,21px);font-weight:900;letter-spacing:.5px;box-shadow:0 4px 14px rgba(224,168,46,.35);}
.st-t{font-size:clamp(16px,1.6vw,28px);font-weight:900;color:#6d5010;line-height:1.25;}
.st-t b{color:var(--terra-ink);}
.st-cn{font-size:clamp(12px,1.1vw,20px);color:#8a6a1e;font-weight:800;line-height:1.3;}
.st-frames{display:flex;flex-wrap:wrap;gap:2px 22px;}
.stepcard .check-item{margin-left:auto;flex-shrink:0;border-width:2px;}
/* 观众屏：句架字号 ≥22px（实际值还要乘整场自适应缩放） */
