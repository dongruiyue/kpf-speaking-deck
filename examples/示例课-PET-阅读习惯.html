<script>
/* ================= 外壳对外 API（模块只能用这些，不许摸内部变量） ================= */
/* 注册表三件套：MODS 模块名 → 模块定义；ACT 同步动作；PARTS 进出快照的模块状态字段 */
const MODS = {};
const ACT = {};
const PARTS = [];
/* 讲义翻页后的回调（模块用 TK.onDeck 挂上来；例如听力播放器「翻走这一页就自动停」） */
const DECK_HOOKS = [];
const TK = {
  version: '1.0.0',
  get isAudience() { return isAudience; },
  go: (id) => doGo(id, true),
  mod: (id, view) => doMod(id, view, true),
  deck: (id, page) => doDeck(id, page, true),
  score: (step, team, n) => addScore(step, team, n, true),
  totals: () => totals(),
  get ledger() { return ledger; },
  broadcast: (msg) => send(msg),
  renderFrameBar: (id) => renderFrameBar(id),
  get deckState() { return deckState; },
  get sfx() { return sfx; },
  get ICONS() { return ICONS; },
  img: (key) => IMG[key] || '',
  on: (name, fn) => { ACT[name] = fn; },
  snapshotPart: (key, get) => TK._part(key).get = get,
  applyPart: (key, fn) => TK._part(key).apply = fn,
  _part: (key) => PARTS.find(p => p.key === key) ||
    (PARTS.push({ key, get: null, apply: null }), PARTS[PARTS.length - 1]),
  registerModule: (name, def) => { MODS[name] = def; return def; },
  get modules() { return MODS; },
  recipeCard: (k) => recipeCard(k),
  deckQuiet: (id, page) => doDeck(id, page, false),
  audio: (key) => AUDIO[key] || '',
  onDeck: (fn) => { DECK_HOOKS.push(fn); },
  /* —— 下面是 §四 清单里没写、但三份现有工具确实在用的能力（见 references/pitfalls.md 的 API 缺口清单） —— */
  timer: (sec, auto) => doTimer(sec, auto, true),
  celebrate: () => celebrate(),
  rnd: (a) => rnd(a),
  beep: (freq, dur, type, vol) => beep(freq, dur, type, vol),
  storage: { get: k => store.get(KEY(k)), set: (k, v) => store.set(KEY(k), v) },
  step: (id) => LESSON.steps.find(s => s.id === id),
  cur: () => cur,                          // 当前环节 id（模块判断「键盘事件该不该我管」用）
  el: (id) => document.getElementById(id),
  $: (sel, root) => (root || document).querySelector(sel),
  $$: (sel, root) => Array.from((root || document).querySelectorAll(sel)),
  /* .stepcard 一行 = 标题 + 句架 + 打勾，draw-question / photo-pair-steps 共用 */
  stepRow: (badge, no, title, cn, frames, attr, i) => `
    <div class="st-row">
      <div class="st-head">
        ${badge ? `<span class="st-badge">${badge}</span>` : ''}
        <span class="st-t">${no} ${title}</span>
        ${cn ? `<span class="st-cn">${cn}</span>` : ''}
        <button class="check-item" ${attr}="${i}" title="这一步做到了就点一下">打勾</button>
        <span class="check-state" aria-hidden="true"></span>
      </div>
      ${(frames || []).map(row => `<div class="st-frames">${row.map(x => `<span class="scf-i">${x}</span>`).join('')}</div>`).join('')}
    </div>`,
};
window.TK = TK;

/* ================= modules/teach-deck.js ================= */
/* modules/teach-deck.js —— 讲义分页（讲练双视图里的「讲解」侧）
 *
 * 职责边界（对照 references/shell-boundary.md）：
 *   §三 的讲义 block 词汇表 → DOM，在本模块；分页机制 deckState / doDeck /
 *   lessonDeckHTML（§二 明列在外壳）留在外壳：外壳搭「框」（deck-top / deck-body /
 *   每页 .deck-page / deck-foot / 翻页按钮），本模块填「页体」。
 *
 * 契约三件套 + 挂载钩子：
 *   init(step)           初始 state（页号的事实源在外壳 deckState，这里只带 pages）
 *   mount(host, step)    挂载：把每页页体填进 .deck-page（幂等）
 *   render(state, host)  纯渲染：只填空页，绝不重写已有页（不重置滚动位置）
 *   actions              观众屏收到广播时怎么套用（quiet：不播声、不广播）
 *   snapshot()           进快照的字段（页号，事实源在外壳）
 *   reset(state)         回第 1 页
 */
(function () {
  const NAME = 'teach-deck';

  /* ============ §三 block 词汇表 → DOM ============ */
  const renderBlocks = bs => (bs || []).map(renderBlock).join('');

  function renderBlock(b) {
    switch (b.type) {
      case 'html': return b.html;
      case 'recipe': return b.keys.length > 1
        ? `<div class="recipe-row">${b.keys.map(TK.recipeCard).join('')}</div>`
        : TK.recipeCard(b.keys[0]);
      case 'kv': return b.rows.map(r =>
        `<div class="kv"><span class="kv-k">${r.k}</span><span class="kv-v">${r.v}</span><span class="kv-t">${r.t || ''}</span></div>`).join('');
      case 'timeline': return `<div class="deck-time">${b.items.map(x => `<span>${x}</span>`).join('')}</div>`;
      case 'steps': return `<div class="deck-steps">${b.items.map((x, i) =>
        `<div class="dk-step"><span class="dk-n">${i + 1}</span><span class="dk-do">${x}</span></div>`).join('')}</div>`;
      case 'tips': return `${b.heading ? `<div class="dk-h">${b.heading}</div>` : ''}`
        + `<ol class="deck-tips-list">${b.items.map(x => `<li>${x}</li>`).join('')}</ol>`;
      case 'frames': return b.groups.map(g => `<div class="dk-blk">`
        + `${g.t ? `<div class="dk-h">${g.t}</div>` : ''}`
        + `<div class="dk-i">${g.i}</div><div class="dk-cn">${g.e}</div></div>`).join('');
      case 'cards': return `<div class="ov-dims">${b.items.map(d =>
        `<div class="ov-dim"><div class="ov-name">${d.t}<span class="ov-score">${d.score}</span></div>`
        + `<div class="ov-cn">${d.cn}</div><div class="ov-q">${d.q}</div>`
        + `<ul class="ov-list">${d.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`
        + (b.foot ? `<div class="dk-cn ov-foot">${b.foot}</div>` : '');
      case 'keytips': return `<div class="deck-keytips">${b.items.map((t, i) =>
        `<div class="dk-tip"><span class="dk-tn">Tip ${i + 1}</span>`
        + `<span><span class="dk-te">${t.en}</span><span class="dk-tc">${t.cn}</span></span></div>`).join('')}</div>`;
      case 'quote': return `<div class="deck-quote">`
        + `${b.label ? `<div class="dk-cn">${b.label}</div>` : ''}`
        + `<div class="${b.cls || 'dk-i'}">${b.text}</div></div>`;
      case 'anno': return `<div class="deck-anno"><div class="dk-ae">${b.e}</div>`
        + `${b.cn ? `<div class="dk-ai">${b.cn}</div>` : ''}</div>`;
      /* text：有序的「行」列表，每行 [kind, 内容, 可选 class, 可选 inline style]。
         kind ∈ h / i / cn / do / mA / ae / ai，渲染成 .dk-<kind>。 */
      case 'text': return (b.lines || []).map(([kind, x, cls, style]) =>
        `<div class="${cls || 'dk-' + kind}"${style ? ` style="${style}"` : ''}>${x}</div>`).join('');
      /* PET 那套「一屏三栏」的三种零件：拆成一页一块之后，仍用它自己的类名与标记，
         这样课堂上的样子没变，只是从并排变成翻页。 */
      case 'notes': return `<div class="teach-col"><h3>${b.h}</h3>`
        + `<ul class="teach-list">${b.items.map((t, i) => `<li data-n="${i + 1}">${t}</li>`).join('')}</ul></div>`;
      case 'langroups': return `<div class="teach-col"><h3>${b.h}</h3>`
        + b.groups.map(g => `<div class="lang-group"><div class="lg-t">${g.t}</div>`
          + `<div class="lg-i">${g.i}</div>${g.e ? `<div class="lg-e">${g.e}</div>` : ''}</div>`).join('') + '</div>';
      case 'samples': return `<div class="teach-col"><h3>${b.h}</h3>`
        + b.items.map(x => `<div class="sample-q">Q：${x.q}</div><div class="sample-a">A：${x.a}</div>`).join('') + '</div>';
      case 'two': return `<div class="ov-two"><div>${renderBlocks(b.left)}</div>`
        + `<div class="deck-quote">${renderBlocks(b.right)}</div></div>`;
    }
    return '';
  }

  const pageBody = p => (p && p.html !== undefined) ? p.html : renderBlocks(p && p.blocks);

  /* 外壳的 lessonDeckHTML 搭框时不需要页体；页体统一走这里 */
  TK.blocks = pageBody;

  /* 只填空页：幂等、不重置滚动位置 */
  function fill(host, pages) {
    if (!host || !pages) return;
    host.querySelectorAll('.deck-page').forEach((el, i) => {
      if (pages[i] && !el.innerHTML.trim()) el.innerHTML = pageBody(pages[i]);
    });
  }

  const mod = {
    init(step) { return { id: step.id, pages: step.lesson || [] }; },

    mount(host, step) { fill(host, step.lesson || []); },

    render(state, host) { if (state) fill(host, state.pages); },

    actions: {
      /* quiet：观众屏套用页号，不播声音、不再广播（否则回环） */
      deck: m => TK.deckQuiet(m.id, m.i),
    },

    snapshot: () => ({ ...TK.deckState }),

    reset(state) { return state; },
  };

  TK.registerModule(NAME, mod);
})();

/* ================= modules/audio-player.js ================= */
/* modules/audio-player.js —— 教材录音播放器（KET 句型库里的 P55 录音）
 *
 * 逐字照搬 KET-U7L3「2 句型库」里的播放器实现（原 `#toolAudio` + auPlay/auBack/auSlow）：
 *   ▶ 播放 / ❚❚ 暂停 / ▶ 继续播放 · ↺ 从头重播 · 0.75× 慢速 · 进度条 + 时间
 *
 * 三条已经修过的规则（照做，不许改）：
 *   1) **播放动作绝不广播** —— 观众屏在同一台机器上，广播出去就是「听两遍」。
 *   2) 播放器整块 `teacher-only` —— 观众屏不出现任何可交互控件。
 *   3) 观众屏不出声 —— 它连 <audio> 都不建（isAudience 直接不挂载）。
 *
 * 素材：mp3 由 scripts/build.py 从 lessons/<课时>.audio/ 读出来转 base64，
 *       放进 LESSON.audio（与照片同一套机制），模块用 TK.audio(key) 取。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'audio-player';
  let P = null, S = null, auEl = null, slow = false;
  const el = n => document.getElementById(P.ids[n]);

  const fmt = s => {
    s = Math.max(0, Math.floor(s || 0));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };

  function skeleton() {
    return `
  <audio id="${P.ids.el}" preload="metadata" src="${TK.audio(P.src)}"></audio>
  <div class="audio-box teacher-only" id="${P.ids.box}">
    <button class="mega-btn" id="${P.ids.play}">${P.playLabel}</button>
    <div class="au-line">
      <div class="audio-bar"><div class="au-fill" id="${P.ids.fill}"></div></div>
      <span class="au-time"><span id="${P.ids.now}">00:00</span> / <span id="${P.ids.tot}">${fmt(P.totalSec)}</span></span>
    </div>
    <button class="ghost-btn" id="${P.ids.back}">${P.backLabel}</button>
    <button class="ghost-btn" id="${P.ids.slow}">${P.slowLabel}</button>
  </div>`;
  }

  function renderAudio() {
    if (!auEl) return;
    const d = auEl.duration || 0, t = auEl.currentTime || 0;
    el('fill').style.width = (d ? Math.min(100, t / d * 100) : 0) + '%';
    el('now').textContent = fmt(t);
    el('tot').textContent = d ? fmt(d) : fmt(P.totalSec);
    const playing = !auEl.paused && !auEl.ended;
    const btn = el('play');
    btn.textContent = playing ? P.pauseLabel : (t > 0.2 && t < d - 0.2 ? P.contLabel : P.playLabel);
    btn.classList.toggle('playing', playing);
  }

  const auStart = () => {
    auEl.playbackRate = slow ? 0.75 : 1;
    const r = auEl.play();
    if (r && r.catch) r.catch(() => {});
  };

  function pause() { if (auEl && !auEl.paused) auEl.pause(); renderAudio(); }
  function show(v) { const b = el('box'); if (b) b.style.display = v ? 'flex' : 'none'; }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { playing: false };
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      /* 观众屏不建 <audio>、不绑任何事件：源头不出声、不出现控件 */
      if (TK.isAudience) return;
      h.insertAdjacentHTML('afterbegin', skeleton());
      auEl = el('el');
      el('play').onclick = () => { if (auEl.paused) auStart(); else auEl.pause(); TK.sfx.click(); renderAudio(); };
      el('back').onclick = () => { auEl.currentTime = 0; auStart(); TK.sfx.click(); renderAudio(); };
      el('slow').onclick = () => {
        slow = !slow;
        auEl.playbackRate = slow ? 0.75 : 1;
        const b = el('slow');
        b.textContent = slow ? P.slowOffLabel : P.slowLabel;
        b.classList.toggle('on', slow);
        TK.sfx.click();
      };
      ['timeupdate', 'loadedmetadata', 'play', 'pause', 'ended', 'ratechange']
        .forEach(ev => auEl.addEventListener(ev, renderAudio));
      auEl.addEventListener('error', () => { el('now').textContent = P.loadFail; });
      show(P.visible !== false);
      renderAudio();
    },
    render() { renderAudio(); },
    actions: {},                                  // 播放动作绝不广播（规则 1）
    snapshot: () => ({}),                          // 播放器不进快照：观众屏本来就不播
    reset(state) { S = state; return S; },
    /* 给别的模块（句型库那种自带分页的）用的控制器 */
    ctl: { pause, show, playing: () => !!auEl && !auEl.paused, el: () => auEl },
  };
  TK.registerModule(NAME, mod);
})();

/* ================= modules/discussion.js ================= */
/* modules/discussion.js —— PET Part 4「话题深入问答」
 *
 * 逐字照搬 PET-L4 里「5 Part 4 · Discussion」那一段的实现：
 *   抽题 → 学生答 → 「Show Model 揭晓范文」对照；答好一次该组 +1。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'discussion';
  let P = null, S = null;
  const el = n => document.getElementById(P.ids[n]);

  function skeleton() {
    return `
  <div class="question" id="${P.ids.q}">${P.emptyText}</div>
  <div class="sentence" id="${P.ids.model}" style="display:none"></div>
  <div id="${P.ids.result}" class="big-sub"></div>
  <div class="teacher-only" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="mega-btn" id="${P.ids.draw}">${P.drawLabel}</button>
    <button class="mega-btn mustard" id="${P.ids.show}">${P.showLabel}</button>
    <button class="ghost-btn" id="${P.ids.timer}">${TK.ICONS.timer} ${P.timerLabel}</button>
  </div>
  <div class="score-team teacher-only">
    ${P.scoreButtons.map(b => `<button class="${b.team === 'A' ? 'a' : 'b'}" data-${P.attr}="${b.team}">${b.label}</button>`).join('')}
  </div>
  <div class="rule-line">${P.rule}</div>`;
  }

  function render() {
    if (!S || S.idx === null) return;
    el('q').textContent = P.questions[S.idx].q;
    const m = el('model');
    m.style.display = S.shown ? 'block' : 'none';
    m.textContent = P.questions[S.idx].model;
    el('result').textContent = S.shown ? P.shownText : '';
  }

  function refill() {
    S.pool = P.questions.map((_, i) => i);
    for (let i = S.pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [S.pool[i], S.pool[j]] = [S.pool[j], S.pool[i]];
    }
  }

  function draw() {
    if (!S.pool.length) refill();
    S.idx = S.pool.pop(); S.shown = false;
    render(); TK.sfx.draw();
    TK.broadcast({ t: P.msg.draw, i: S.idx });
  }
  function show() {
    if (S.idx === null) return;
    S.shown = !S.shown;
    render(); TK.sfx.draw();
    TK.broadcast({ t: P.msg.show, shown: S.shown });
  }

  function applySnap(s) {
    if (!s) return;
    if (s.idx !== undefined) S.idx = s.idx;
    if (s.shown !== undefined) S.shown = !!s.shown;
    render();
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { pool: [], idx: null, shown: false };
      refill();
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      h.insertAdjacentHTML('afterbegin', skeleton());
      el('draw').onclick = draw;
      el('show').onclick = show;
      el('timer').onclick = () => TK.timer(P.timerSec, true);
      document.querySelectorAll(`[data-${P.attr}]`).forEach(b => b.onclick = () => {
        TK.score(step.id, b.dataset[P.attr], 1); TK.sfx.draw();
      });
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg.draw, m => applySnap({ idx: m.i, shown: false }));
      TK.on(P.msg.show, m => applySnap({ shown: m.shown }));
    },
    render,
    actions: {},
    snapshot: () => ({ idx: S.idx, shown: S.shown }),
    reset(state) { S = state; refill(); return S; },
  };
  TK.registerModule(NAME, mod);
})();

/* ================= modules/draw-question.js ================= */
/* modules/draw-question.js —— 「抽题快答」
 *
 * 三份文件里同构的两处合并成一份（差异见 references/pitfalls.md）：
 *   layout:'checks'  FCE Part 1 —— 抽题 + 三招打勾（用上哪招该组 +1；三块全中两组各 +1）+ 换手 / 重来
 *   layout:'plain'   PET Part 1 —— 抽题（Phase 1 基本信息 / Phase 2 拓展回答）+ 拓展三法计分按钮 + 计时按钮
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 * 铁律：本地动作执行一次并广播一次；收到广播只套用状态，绝不再本地计分。
 *      快照字段只在 mount 时注册 —— 没挂载的模块不会污染快照。
 */
(function () {
  const NAME = 'draw-question';
  let P = null;        // 课时参数（step.practice）
  let S = null;        // 私有状态
  let bank = null;     // checks: { 卷名: [题…] }；plain: [{ q, phase }]
  let stepId = null;   // 当前环节 id —— 计分必须用它，不许用 P.step（课时数据里可能根本没传）

  /* 打勾卡数组按「课时实际给了几张卡」初始化 —— 写死 3 张会让只给 1 张卡的课永远完成不了 */
  const freshUsed = () => Array((P.cards || []).length).fill(false);

  const id = n => P.ids[n];
  const el = n => document.getElementById(id(n));
  /* 'p2Check' → 'data-p2-check'（datase 读用 camelCase，选择器 / 属性写用连字符） */
  /* 属性名可能缺省：FCE 只有 cardAttr，PET 只有 scoreAttr —— 缺省时落到 data-none，选不到任何元素 */
  const ATTR = k => (k ? 'data-' + k.replace(/([A-Z])/g, '-$1').toLowerCase() : 'data-none');
  const q = k => document.querySelectorAll('[' + ATTR(k) + ']');

  /* ---------------- 静态骨架：只建一次 ---------------- */
  function skeleton() {
    const chips = (P.chips || []).map(row =>
      `<div class="reminder-chips">${row.map(c => `<span>${c}</span>`).join('')}</div>`).join('');
    if (P.layout === 'plain') {
      return `
  <div class="sentence" id="${id('box')}" style="display:none"></div>
  <div class="big-word" id="${id('topic')}" style="font-size:clamp(20px,2.8vw,30px)">${P.emptyText}</div>
  ${chips}
  <div class="teacher-only" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="mega-btn" id="${id('draw')}">${P.drawLabel}</button>
    ${P.timer ? `<button class="ghost-btn" id="${id('timer')}">${TK.ICONS.timer} ${P.timer.label}</button>` : ''}
  </div>
  <div class="score-team teacher-only">${(P.scoreButtons || []).map(b =>
    `<button class="${b.team === 'A' ? 'a' : 'b'}" data-${P.scoreAttr}="${b.team}">${b.label}</button>`).join('')}</div>
  <div class="rule-line">${P.rule}</div>`;
    }
    return `
  <div class="turn-label" id="${id('turn')}"></div>
  <div class="teacher-only" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="mega-btn" id="${id('draw')}">${P.drawLabel}</button>
  </div>
  <div class="q-bar" id="${id('box')}"></div>
  <div class="stepcard" id="${id('steps')}">${(P.cards || []).map((c, i) =>
    TK.stepRow(i === 0 ? P.badge : '', P.nos[i], c.t, c.cn, c.frames, `data-${P.cardAttr}`, i)).join('')}</div>
  <div class="teacher-only" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="ghost-btn" id="${id('sw')}">${P.switchLabel}</button>
    <button class="ghost-btn" id="${id('reset')}">${P.resetLabel}</button>
  </div>
  <div class="rule-line">${P.rule}</div>`;
  }

  /* ---------------- 纯渲染：幂等，不重置滚动 ---------------- */
  function render() {
    if (!S) return;
    if (P.layout === 'plain') {
      const drawn = S.idx !== null;
      const q = drawn ? bank[S.idx] : null;
      const box = el('box');
      box.style.display = drawn ? 'block' : 'none';
      box.textContent = drawn ? q.q : '';
      el('topic').textContent = drawn ? P.topicOf(q) : P.emptyText;
      el('draw').textContent = drawn ? P.nextLabel : P.drawLabel;
      return;
    }
    const drawn = S.test !== null && S.idx !== null;
    el('box').innerHTML = drawn
      ? `<span class="q-tag">${S.test} · ${P.tag}</span>${bank[S.test][S.idx]}`
      : `<span class="q-tag">${P.emptyTag}</span>${P.emptyText}`;
    q(P.cardAttr).forEach(b => {
      const i = +b.dataset[P.cardAttr];
      b.classList.toggle('on', S.used[i]);
      b.disabled = S.done || S.used[i];
      b.textContent = S.used[i] ? '已打勾' : '打勾';
      /* 观众屏不显示按钮，改显示状态标记（✓ = 这招用上了） */
      const st = b.parentElement && b.parentElement.querySelector('.check-state');
      if (st) st.textContent = S.used[i] ? '✓' : '';
    });
    const tl = el('turn');
    tl.textContent = S.done ? P.doneText : `${P.turnPrefix}${S.turn}${drawn ? P.turnSuffix : ''}`;
    tl.style.color = S.done ? 'var(--green)' : (S.turn === 'A' ? 'var(--teal)' : 'var(--terra-ink)');
    el('draw').textContent = drawn ? P.nextLabel : P.drawLabel;
  }

  /* ---------------- 抽题池 ---------------- */
  function refill() {
    if (P.layout === 'plain') {
      S.pool = bank.map((_, i) => i);
    } else {
      S.pool = [];
      Object.keys(bank).forEach(t => bank[t].forEach((_, i) => S.pool.push({ t, i })));
    }
    for (let i = S.pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [S.pool[i], S.pool[j]] = [S.pool[j], S.pool[i]];
    }
  }

  const emit = () => TK.broadcast(P.msgShape === 'plain'
    ? { t: P.msg, i: S.idx }
    : { t: P.msg, s: mod.snapshot() });

  /* ---------------- 本地动作：执行一次 + 广播一次 ---------------- */
  function draw() {
    if (!S.pool.length) refill();
    const q = S.pool.pop();
    if (P.layout === 'plain') {
      S.idx = q;
      render(); TK.sfx.draw(); emit(); return;
    }
    const had = S.test !== null;
    S.test = q.t; S.idx = q.i;
    S.used = freshUsed(); S.done = false;
    if (had) S.turn = S.turn === 'A' ? 'B' : 'A';
    render(); TK.sfx.draw(); emit();
  }

  function card(i) {
    if (S.test === null || S.done || S.used[i]) return;
    S.used[i] = true;
    TK.score(stepId, S.turn, 1);
    if (S.used.every(Boolean)) {
      S.done = true;
      TK.score(stepId, 'A', P.reward); TK.score(stepId, 'B', P.reward);
      TK.celebrate();
    }
    render(); TK.sfx.draw(); emit();
  }

  function flip() {
    S.turn = S.turn === 'A' ? 'B' : 'A';
    render(); TK.sfx.click(); emit();
  }

  function reset() {
    S.used = freshUsed(); S.done = false;
    refill(); render(); TK.sfx.click(); emit();
  }

  function applySnap(s) {
    if (!s) return;
    S.pool = (s.pool || []).slice();
    if (P.layout === 'plain') {
      S.idx = (s.idx === undefined ? null : s.idx);
      render(); return;
    }
    S.test = s.test || null;
    S.idx = (s.idx === undefined ? null : s.idx);
    S.turn = s.turn || 'A';
    S.used = (s.used && s.used.length === freshUsed().length ? s.used : freshUsed()).slice();
    S.done = !!s.done;
    render();
  }

  const mod = {
    /* 1) 初始 state */
    init(step, practice) {
      P = practice;
      stepId = step.id;
      bank = P.bank;
      S = P.layout === 'plain'
        ? { pool: [], idx: null, last: null }
        : { pool: [], test: null, idx: null, turn: 'A', used: freshUsed(), done: false };
      refill();
      return S;
    },

    /* 挂载：建骨架 + 绑事件 + 注册快照字段（每次挂载只做一次） */
    mount(h, step, practice) {
      P = practice;
      stepId = step.id;
      h.insertAdjacentHTML('afterbegin', skeleton());
      el('draw').onclick = draw;
      if (el('sw')) el('sw').onclick = flip;
      if (el('reset')) el('reset').onclick = reset;
      if (el('timer')) el('timer').onclick = () => TK.timer(P.timer.sec, true);
      q(P.cardAttr).forEach(b => b.onclick = () => card(+b.dataset[P.cardAttr]));
      q(P.scoreAttr).forEach(b => b.onclick = () => {
        TK.score(step.id, b.dataset[P.scoreAttr], 1); TK.sfx.draw();
      });
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg, m => (P.msgShape === 'plain' ? (S.idx = m.i, render()) : applySnap(m.s)));
    },

    /* 2) 纯渲染 */
    render,

    /* 3) 观众屏收到广播时怎么套用（本模块的 msg 已由 TK.on 接管，这里留空） */
    actions: {},

    /* 4) 进快照的字段 */
    snapshot: () => (P.layout === 'plain'
      ? { pool: S.pool.slice(), idx: S.idx }
      : { pool: S.pool, test: S.test, idx: S.idx, turn: S.turn, used: S.used.slice(), done: S.done }),

    reset(state) { S = state; refill(); return S; },
  };

  TK.registerModule(NAME, mod);
})();

/* ================= modules/flash-cards.js ================= */
/* modules/flash-cards.js —— KET「Warm-up 快闪」
 *
 * 逐字照搬 KET-U7L3 里「1 快闪」那一段的实现：
 *   30s Memory 倒计时 → 自动盖住单词 → 指图抢答，抢答对点该组 +1；Cover / Show 手动盖翻。
 *   倒计时本身不广播（只广播盖/翻），与原实现一致。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'flash-cards';
  let P = null, S = null, cdTimer = null;
  const el = n => document.getElementById(P.ids[n]);
  const PIC = k => `<img class="picimg" src="${TK.img(k)}" alt="">`;

  function skeleton() {
    return `
  <div class="flash-grid" id="${P.ids.grid}"></div>
  <div id="${P.ids.cd}" style="display:none"></div>
  <div class="score-team teacher-only">
    ${P.scoreButtons.map(b => `<button class="${b.team === 'A' ? 'a' : 'b'}" data-${P.attr}="${b.team}">${b.label}</button>`).join('')}
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center" class="teacher-only">
    <button class="ghost-btn" id="${P.ids.cover}">${P.coverLabel}</button>
    <button class="ghost-btn" id="${P.ids.reveal}">${P.revealLabel}</button>
    <button class="ghost-btn" id="${P.ids.timer}">${TK.ICONS.timer} ${P.timerLabel}</button>
  </div>
  <div class="rule-line">${P.rule}</div>`;
  }

  function buildGrid() {
    const grid = el('grid');
    grid.innerHTML = '';
    P.places.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'flash-card';
      d.innerHTML = `<span class="pic">${PIC(p.svg)}</span><div class="name">${p.name}</div>`;
      d.onclick = () => toggle(i, !S.covered[i]);
      grid.appendChild(d);
    });
  }

  /* setFlashCard：只改这一张，不重建网格（原实现同此） */
  function setCard(i, cov) {
    S.covered[i] = cov;
    const d = el('grid').children[i];
    if (!d) return;
    d.classList.toggle('covered', cov);
    d.querySelector('.name').textContent = cov ? '?' : P.places[i].name;
  }

  function render() {
    if (!S) return;
    if (el('grid').children.length !== P.places.length) buildGrid();
    P.places.forEach((_, i) => setCard(i, S.covered[i]));
  }

  function toggle(i, cov) {
    setCard(i, cov); TK.sfx.click();
    TK.broadcast({ t: P.msg.toggle, i, cov });
  }
  function coverAll(cov, quiet) {
    P.places.forEach((_, i) => setCard(i, cov));
    TK.sfx.click();
    if (!quiet) TK.broadcast({ t: P.msg.coverAll, cov });
  }

  /* 30 秒记忆倒计时：与原来一样，只在本机走，不广播 */
  function memory() {
    const btn = el('timer'), cd = el('cd');
    coverAll(false, true);
    btn.disabled = true;
    cd.style.display = 'block';
    let t = P.memorySec;
    cd.innerHTML = `<div class="timer-num" style="font-size:clamp(56px,9vw,96px)">${t}</div>`
      + `<div class="big-sub">${P.memoryText}</div>`;
    const numEl = cd.querySelector('.timer-num');
    clearInterval(cdTimer);
    cdTimer = setInterval(() => {
      t--;
      if (t <= 0) {
        clearInterval(cdTimer); cdTimer = null;
        cd.style.display = 'none';
        btn.disabled = false;
        coverAll(true, false);
        TK.sfx.end();
        return;
      }
      numEl.textContent = t;
      numEl.classList.toggle('warn', t <= 5);
    }, 1000);
  }

  function applySnap(cov) {
    if (!Array.isArray(cov)) return;
    cov.forEach((c, i) => setCard(i, c));
  }

  const mod = {
    init(step, practice) {
      P = practice;
      S = { covered: P.places.map(() => false) };
      return S;
    },
    mount(h, step, practice) {
      P = practice;
      S = S || { covered: P.places.map(() => false) };
      h.insertAdjacentHTML('afterbegin', skeleton());
      buildGrid();
      el('cover').onclick = () => coverAll(true, false);
      el('reveal').onclick = () => coverAll(false, false);
      el('timer').onclick = memory;
      document.querySelectorAll(`[data-${P.attr}]`).forEach(b => b.onclick = () => {
        TK.score(step.id, b.dataset[P.attr], 1); TK.sfx.draw();
      });
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg.toggle, m => setCard(m.i, m.cov));
      TK.on(P.msg.coverAll, m => applySnap(P.places.map(() => m.cov)));
    },
    render,
    actions: {},
    snapshot: () => S.covered.slice(),
    reset(state) { S = state || { covered: P.places.map(() => false) }; return S; },
  };
  TK.registerModule(NAME, mod);
})();

/* ================= modules/mock-exam.js ================= */
/* modules/mock-exam.js —— KET「Mock Test 模拟考试」
 *
 * 逐字照搬 KET-U7L3 里「4 模拟考试」那一段的实现：
 *   Phase 1 同桌讨论（五个地方都聊到 → 2 分钟计时）
 *   Phase 2 考官问答（学生名单 → RAID 突袭滚动抽人抽题 → 答好该组 +1）
 *   互评表：五条自评 + 五星（全中放彩带）。
 *   名单存在本课命名空间里（原来直接写 localStorage 的 ket_names）。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'mock-exam';
  let P = null, S = null;
  const el = n => document.getElementById(P.ids[n]);
  const PIC = k => `<img class="picimg" src="${TK.img(k)}" alt="">`;

  function skeleton() {
    return `
  <div class="phase-tabs teacher-only">
    <button id="${P.ids.ph1Tab}" class="cur">${P.ph1Label}</button>
    <button id="${P.ids.ph2Tab}">${P.ph2Label}</button>
  </div>
  <div id="${P.ids.phase1}" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:16px">
    <div class="big-word" style="font-size:clamp(24px,3.6vw,38px)">${P.ph1Title}</div>
    <div class="flash-grid" id="${P.ids.ph1Grid}" style="max-width:820px"></div>
    <div class="reminder-chips">${P.ph1Chips.map(c => `<span>${c}</span>`).join('')}</div>
    <div class="big-sub">${P.ph1Note}</div>
    <button class="mega-btn" id="${P.ids.ph1Btn}">${TK.ICONS.timer} ${P.ph1Btn}</button>
  </div>
  <div id="${P.ids.phase2}" style="width:100%;display:none;flex-direction:column;align-items:center;gap:16px">
    <details class="settings teacher-only">
      <summary>${P.namesLabel}</summary>
      <div style="height:8px"></div>
      <textarea class="names-box" id="${P.ids.names}" rows="2" placeholder="${P.namesPlaceholder}"></textarea>
    </details>
    <div class="name-scroll" id="${P.ids.raidName}">${P.raidReady}</div>
    <div class="question" id="${P.ids.raidQ}">${P.raidHint}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
      <button class="mega-btn terra" id="${P.ids.raidBtn}">${P.raidLabel}</button>
      <button class="ghost-btn teacher-only" id="${P.ids.checkBtn}">${P.checkLabel}</button>
    </div>
    <div class="score-team teacher-only">
      ${P.scoreButtons.map(b => `<button class="${b.team === 'A' ? 'a' : 'b'}" data-${P.attr}="${b.team}">${b.label}</button>`).join('')}
    </div>
    <div class="check-panel teacher-only" id="${P.ids.checkPanel}" style="display:none">
      ${P.checklist.map(c => `<label><input type="checkbox">${c}</label>`).join('')}
      <div class="stars" id="${P.ids.stars}">☆☆☆☆☆</div>
    </div>
    <div class="rule-line">${P.rule}</div>
  </div>`;
  }

  function buildPh1Grid() {
    const grid = el('ph1Grid');
    grid.innerHTML = '';
    P.places.forEach(p => {
      const d = document.createElement('div');
      d.className = 'flash-card static';
      d.innerHTML = `<span class="pic">${PIC(p.svg)}</span><div class="name">${p.name}</div>`;
      grid.appendChild(d);
    });
  }

  function render() {
    if (!S) return;
    el('phase1').style.display = S.phase === 1 ? 'flex' : 'none';
    el('phase2').style.display = S.phase === 2 ? 'flex' : 'none';
    el('ph1Tab').classList.toggle('cur', S.phase === 1);
    el('ph2Tab').classList.toggle('cur', S.phase === 2);
    if (S.name !== null || S.q !== null) doRaid(S.name, S.q, true);
  }

  function phase(n, quiet) {
    S.phase = n;
    render();
    TK.sfx.click();
    if (!quiet) TK.broadcast({ t: P.msg.phase, n });
  }

  function doRaid(name, q, quiet) {
    S.name = name; S.q = q;
    el('raidName').textContent = name;
    el('raidQ').textContent = q;
    TK.sfx.draw();
    if (!quiet) TK.broadcast({ t: P.msg.raid, name, q });
  }

  /* RAID：滚动抽名 + 滴答声（纯本机动画，抽完才广播结果） */
  function raid() {
    const names = el('names').value.split(/[,，、\s]+/).filter(Boolean);
    const poolN = names.length ? names : [P.everyone];
    el('raidQ').textContent = '...';
    let n = 0;
    const scroll = setInterval(() => {
      el('raidName').textContent = TK.rnd(poolN);
      TK.beep(500 + n * 30, .05);
      if (++n > 12) {
        clearInterval(scroll);
        doRaid(TK.rnd(poolN), TK.rnd(P.raidQuestions), false);
      }
    }, 90);
  }

  function applySnap(s) {
    if (!s) return;
    if (s.phase) phase(s.phase, true);
    if (s.name !== undefined && (s.name !== null || s.q !== null)) doRaid(s.name, s.q, true);
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { phase: 1, name: null, q: null };
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      S = S || { phase: 1, name: null, q: null };
      h.insertAdjacentHTML('afterbegin', skeleton());
      buildPh1Grid();
      el('ph1Tab').onclick = () => phase(1, false);
      el('ph2Tab').onclick = () => phase(2, false);
      el('ph1Btn').onclick = () => TK.timer(P.ph1Sec, true);
      el('raidBtn').onclick = raid;
      el('checkBtn').onclick = () => {
        const p = el('checkPanel');
        p.style.display = p.style.display === 'none' ? 'block' : 'none';
        TK.sfx.click();
      };
      document.querySelectorAll(`[data-${P.attr}]`).forEach(b => b.onclick = () => {
        TK.score(step.id, b.dataset[P.attr], 1);
        TK.sfx.draw();
      });
      /* 学生名单：只存本机（不广播），键名走本课命名空间 */
      const namesEl = el('names');
      namesEl.value = TK.storage.get(P.namesKey) || '';
      namesEl.oninput = () => TK.storage.set(P.namesKey, namesEl.value);
      /* 互评表：五条自评 → 五颗星 */
      const boxes = document.querySelectorAll(`#${P.ids.checkPanel} input`);
      boxes.forEach(b => b.onchange = () => {
        const n = [...boxes].filter(x => x.checked).length;
        el('stars').textContent = '★'.repeat(n) + '☆'.repeat(5 - n);
        if (n === 5) TK.celebrate(); else TK.sfx.click();
      });
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg.phase, m => phase(m.n, true));
      TK.on(P.msg.raid, m => doRaid(m.name, m.q, true));
    },
    render,
    actions: {},
    snapshot: () => ({ phase: S.phase, name: S.name, q: S.q }),
    reset(state) { S = state; return S; },
  };
  TK.registerModule(NAME, mod);
})();

/* ================= modules/negotiate.js ================= */
/* modules/negotiate.js —— PET Part 3「协作任务 / 协商决策」
 *
 * 逐字照搬 PET-L4 里「4 Part 3 · 协作任务」那一段的实现：
 *   点一次 = 讨论过（黄）· 再点 = 定为决定（绿，同时把别的决定降回「讨论过」）
 *   讨论完所有选项后点「Agree!」→ 双方各 +2。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'negotiate';
  let P = null, S = null;
  const el = n => document.getElementById(P.ids[n]);

  function skeleton() {
    return `
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center" class="teacher-only">
    <button class="mega-btn" id="${P.ids.timer}">${TK.ICONS.timer} ${P.timerLabel}</button>
    <button class="mega-btn mustard" id="${P.ids.decide}">${P.decideLabel}</button>
    <button class="ghost-btn" id="${P.ids.reset}">${P.resetLabel}</button>
  </div>
  <div class="media-split">
    <img src="${TK.img(P.image)}" alt="" style="max-width:300px;flex:0 1 300px">
    <div class="media-side">
      <div class="scaffold" style="font-size:clamp(14px,1.9vw,20px);padding:12px 18px">
        <b>${P.situationEn}</b><br>${P.situationCn}
      </div>
      <div class="reminder-chips" id="${P.ids.chips}"></div>
      <div class="reminder-chips">${(P.chips || []).map(c => `<span>${c}</span>`).join('')}</div>
      <div id="${P.ids.result}" class="big-sub"></div>
    </div>
  </div>
  <div class="rule-line">${P.rule}</div>`;
  }

  function render() {
    if (!S) return;
    el('chips').innerHTML = P.options.map((o, i) => {
      const st = S.state[i];
      const cls = st === 2 ? 'chip decided' : (st === 1 ? 'chip talked' : 'chip');
      const mark = st === 2 ? '★ ' : (st === 1 ? '✓ ' : '');
      return `<button class="${cls}" data-${P.attr}="${i}">${mark}${o}</button>`;
    }).join('');
    document.querySelectorAll(`[data-${P.attr}]`).forEach(b => b.onclick = () => step(+b.dataset[P.attr]));
    const di = S.state.indexOf(2);
    el('result').innerHTML = di < 0 ? '' : `<b>We decided: ${P.options[di]}</b> — because …`;
  }

  function step(i) {
    if (S.done) return;
    S.state[i] = (S.state[i] + 1) % 3;
    if (S.state[i] === 2) S.state = S.state.map((v, k) => (k === i || v !== 2) ? v : 1);
    render(); TK.sfx.click();
    TK.broadcast({ t: P.msg.step, state: S.state.slice() });
  }

  /* quiet=true 是「收到广播」这条路径：只套用状态，绝不再本地计分（铁律 2）。
     分数由同一次操作发出的 {t:'score'} 快照统一对齐。 */
  function decide(quiet) {
    if (S.done && !quiet) return;
    if (S.state.indexOf(2) < 0) {
      if (!quiet) el('result').textContent = P.needDecide;
      return;
    }
    S.done = true;
    if (!quiet) { TK.score(P.step, 'A', P.doneScore); TK.score(P.step, 'B', P.doneScore); }
    render();
    el('result').innerHTML =
      `<b>We decided: ${P.options[S.state.indexOf(2)]}</b> — because …` +
      `<br>讨论过 ${S.state.filter(v => v > 0).length} / ${P.options.length} 项`;
    TK.celebrate();
    if (!quiet) TK.broadcast({ t: P.msg.decide });
  }

  function reset(quiet) {
    S.state = P.options.map(() => 0); S.done = false;
    el('result').innerHTML = '';
    render(); TK.sfx.click();
    if (!quiet) TK.broadcast({ t: P.msg.reset });
  }

  function applySnap(s) {
    if (!s) return;
    if (s.state) { S.state = s.state.slice(); S.done = !!s.done; render(); }
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { state: P.options.map(() => 0), done: false };
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      h.insertAdjacentHTML('afterbegin', skeleton());
      el('timer').onclick = () => TK.timer(P.timerSec, true);
      el('decide').onclick = () => decide(false);
      el('reset').onclick = () => reset(false);
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg.step, m => applySnap({ state: m.state, done: S.done }));
      TK.on(P.msg.decide, () => decide(true));
      TK.on(P.msg.reset, () => reset(true));
    },
    render,
    actions: {},
    snapshot: () => ({ state: S.state.slice(), done: S.done }),
    reset(state) { S = state; return S; },
  };
  TK.registerModule(NAME, mod);
})();

/* ================= modules/ox-bingo.js ================= */
/* modules/ox-bingo.js —— KET「Tic-Tac Bingo OX 棋」
 *
 * 逐字照搬 KET-U7L3 里「5 OX 棋」那一段的实现：
 *   两组轮流选格，占格 +1；连成一条线再 +2（放彩带）；格子占满没连线 = 平局。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'ox-bingo';
  let P = null, S = null;
  const el = n => document.getElementById(P.ids[n]);
  const PIC = k => `<img class="picimg" src="${TK.img(k)}" alt="">`;

  function skeleton() {
    return `
  <div class="turn-label" id="${P.ids.turn}"></div>
  <div class="bingo-grid3" id="${P.ids.grid}"></div>
  <div id="${P.ids.win}"></div>
  <button class="ghost-btn teacher-only" id="${P.ids.reset}">${P.resetLabel}</button>
  <div class="rule-line">${P.rule}</div>`;
  }

  function render() {
    if (!S) return;
    const grid = el('grid');
    grid.innerHTML = '';
    P.cells.forEach((c, ci) => {
      const p = P.places[c.pi];
      const owner = S.claims[ci];
      const d = document.createElement('button');
      d.className = 'bingo-cell' + (owner ? (owner === 'A' ? ' claimedA' : ' claimedB') : '');
      d.innerHTML = `<span class="pic">${PIC(p.svg)}</span><div class="nm">${p.name}</div>`
        + `<div class="pol">${c.like ? 'Like' : "Don't like"}</div>`;
      if (owner) d.innerHTML += `<span class="mark">${owner === 'A' ? 'O' : 'X'}</span>`;
      d.onclick = () => claim(ci, false);
      grid.appendChild(d);
    });
    updateTurn();
  }

  function updateTurn() {
    const label = el('turn');
    label.textContent = S.done ? '' : (S.turn === 'A' ? P.turnA : P.turnB);
    label.style.color = S.turn === 'A' ? 'var(--teal)' : 'var(--terra)';
  }

  function renderWin() {
    const w = S.winner;
    el('win').innerHTML = w
      ? `<div class="win-banner">Team ${w} makes a line! +2 · ${w} 组连线成功！</div>`
      : `<div class="win-banner">It's a draw! · 格子占满，平局！</div>`;
  }

  /* quiet=true 是「收到广播」这条路径：用同一套判定重算局面，但绝不再本地计分（铁律 2）；
     庆祝动画保留 —— 观众屏静音，只在投影上放彩带。 */
  function claim(ci, quiet) {
    if (S.done || S.claims[ci]) return;
    S.claims[ci] = S.turn;
    if (!quiet) TK.score(P.step, S.turn, P.squareScore);
    const line = P.winLines.find(l => l.every(i => S.claims[i] === S.turn));
    if (line) {
      S.done = true;
      S.winner = S.turn;
      if (!quiet) TK.score(P.step, S.turn, P.lineScore);
      render(); renderWin(); TK.celebrate();
    } else if (S.claims.every(Boolean)) {
      S.done = true; S.winner = null;
      render(); renderWin(); TK.sfx.win();
    } else {
      S.turn = S.turn === 'A' ? 'B' : 'A';
      render(); TK.sfx.draw();
    }
    if (!quiet) TK.broadcast({ t: P.msg.claim, ci });
  }

  function reset(quiet) {
    S = { claims: Array(9).fill(null), turn: 'A', done: false, winner: null };
    el('win').innerHTML = '';
    render(); TK.sfx.click();
    if (!quiet) TK.broadcast({ t: P.msg.reset });
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { claims: Array(9).fill(null), turn: 'A', done: false, winner: null };
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      S = S || { claims: Array(9).fill(null), turn: 'A', done: false, winner: null };
      h.insertAdjacentHTML('afterbegin', skeleton());
      el('reset').onclick = () => reset(false);
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg.claim, m => claim(m.ci, true));   // 与迁移前一致：按同一判定重算，不再计分
      TK.on(P.msg.reset, () => { S = { claims: Array(9).fill(null), turn: 'A', done: false, winner: null }; el('win').innerHTML = ''; render(); });
    },
    render,
    actions: {},
    snapshot: () => ({ claims: S.claims.slice(), turn: S.turn, done: S.done, winner: S.winner }),
    reset(state) { S = state; return S; },
  };

  /* 观众屏收到 bingoClaim 时，本地按同样的规则重算一次局面（与原实现一致：
     原 ACT 只用 ci 重建，靠同一套判定得出 turn/done/winner） */
  function applySnap(s) {
    if (!s) return;
    if (s.claims) S.claims = s.claims.slice();
    if (s.turn) S.turn = s.turn;
    if (s.done !== undefined) S.done = !!s.done;
    if (s.winner !== undefined) S.winner = s.winner;
    render();
    if (S.done) renderWin();
  }

  TK.registerModule(NAME, mod);
})();

/* ================= modules/pair-task.js ================= */
/* modules/pair-task.js —— KET「Pair Task 双人任务」
 *
 * 逐字照搬 KET-U7L3 里「3 双人任务」那一段的实现：
 *   点地方卡 → 放进下面两个槽（最多两个，可取消）；点「Speak Out!」→ 双方各 +2；
 *   没选够两个只提示、不加分。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'pair-task';
  let P = null, S = null;
  const el = n => document.getElementById(P.ids[n]);
  const PIC = k => `<img class="picimg" src="${TK.img(k)}" alt="">`;

  function skeleton() {
    return `
  <div class="big-word" style="font-size:clamp(24px,3.6vw,38px)">${P.title}</div>
  <div class="scaffold">
    <b>${P.taskEn}</b><br>
    ${P.taskCn}
  </div>
  <div class="flash-grid" id="${P.ids.grid}" style="max-width:820px"></div>
  <div class="pair-slots">
    <div class="pair-slot" id="${P.ids.slot0}">?</div>
    <div class="pair-slot" id="${P.ids.slot1}">?</div>
  </div>
  <div class="reminder-chips">${P.chips.map(c => `<span>${c}</span>`).join('')}</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center" class="teacher-only">
    <button class="mega-btn" id="${P.ids.timer}">${TK.ICONS.timer} ${P.timerLabel}</button>
    <button class="mega-btn mustard" id="${P.ids.done}">${P.doneLabel}</button>
    <button class="ghost-btn" id="${P.ids.reset}">${P.resetLabel}</button>
  </div>
  <div id="${P.ids.win}"></div>
  <div class="rule-line">${P.rule}</div>`;
  }

  function buildGrid() {
    const grid = el('grid');
    grid.innerHTML = '';
    P.places.forEach((p, i) => {
      const d = document.createElement('div');
      d.className = 'flash-card';
      d.innerHTML = `<span class="pic">${PIC(p.svg)}</span><div class="name">${p.name}</div>`;
      d.onclick = () => toggle(i);
      grid.appendChild(d);
    });
  }

  function render() {
    if (!S) return;
    const grid = el('grid');
    if (grid.children.length !== P.places.length) buildGrid();
    [...grid.children].forEach((d, i) => {
      const on = S.chosen.includes(i);
      d.classList.toggle('chosen', on);
      let tick = d.querySelector('.tick');
      if (on && !tick) { tick = document.createElement('span'); tick.className = 'tick'; tick.textContent = '✓'; d.appendChild(tick); }
      if (!on && tick) tick.remove();
    });
    [0, 1].forEach(k => {
      const slot = el('slot' + k);
      const pi = S.chosen[k];
      if (pi === undefined) { slot.className = 'pair-slot'; slot.textContent = '?'; }
      else {
        slot.className = 'pair-slot filled';
        slot.innerHTML = `<span class="pic">${PIC(P.places[pi].svg)}</span><div class="nm">${P.places[pi].name}</div>`;
      }
    });
  }

  function toggle(i) {
    if (S.done) return;
    const k = S.chosen.indexOf(i);
    if (k >= 0) S.chosen.splice(k, 1);
    else if (S.chosen.length < 2) S.chosen.push(i);
    else return;
    render(); TK.sfx.click();
    TK.broadcast({ t: P.msg.toggle, chosen: S.chosen.slice() });
  }

  /* quiet=true 是「收到广播」这条路径：只套用状态，绝不再本地计分（铁律 2） */
  function done(quiet) {
    if (S.chosen.length < 2) {
      el('win').innerHTML = `<div class="big-sub">${P.needTwo}</div>`;
      return;
    }
    S.done = true;
    if (!quiet) {
      TK.score(P.step, 'A', P.doneScore);
      TK.score(P.step, 'B', P.doneScore);
    }
    const names = S.chosen.map(i => P.places[i].name);
    el('win').innerHTML =
      `<div class="win-banner">Great decision! · 决定：${names[0]} + ${names[1]}</div>
     <div class="big-sub">Everyone say: ${P.doneLine ? P.doneLine.replace('{a}', names[0]).replace('{b}', names[1] || names[0]) : `We'd like to go to the ${names[0]} and the ${names[1]} because ...`}</div>`;
    TK.celebrate();
    if (!quiet) TK.broadcast({ t: P.msg.done });
  }

  function reset(quiet) {
    S.chosen = []; S.done = false;
    el('win').innerHTML = '';
    render(); TK.sfx.click();
    if (!quiet) TK.broadcast({ t: P.msg.reset });
  }

  function applySnap(s) {
    if (!s) return;
    el('win').innerHTML = '';
    if (s.chosen) S.chosen = s.chosen.slice();
    S.done = !!s.done;
    render();
    if (S.done) done(true);
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { chosen: [], done: false };
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      S = S || { chosen: [], done: false };
      h.insertAdjacentHTML('afterbegin', skeleton());
      buildGrid();
      el('timer').onclick = () => TK.timer(P.timerSec, true);
      el('done').onclick = () => done(false);
      el('reset').onclick = () => reset(false);
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg.toggle, m => applySnap({ chosen: m.chosen, done: S.done }));
      TK.on(P.msg.done, () => done(true));
      TK.on(P.msg.reset, () => reset(true));
    },
    render,
    actions: {},
    snapshot: () => ({ chosen: S.chosen.slice(), done: S.done }),
    reset(state) { S = state; return S; },
  };
  TK.registerModule(NAME, mod);
})();

/* ================= modules/photo-pair-steps.js ================= */
/* modules/photo-pair-steps.js —— Part 2「真题 + 两张照片 + 操作卡/句架/打勾三合一」
 *
 * 用在 FCE Part 2 练习页（§六 的 photo-pair-steps）：
 *   选真题 → 题目 + 两张照片 → 三步打勾（三步全中该组 +2）→ 60s 长发言 / 追问 30s（答好该组 +1）
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 * 铁律：本地动作执行一次并广播一次；收到广播只套用状态，绝不再本地计分。
 */
(function () {
  const NAME = 'photo-pair-steps';
  let P = null, S = null;
  const ATTR = k => (k ? 'data-' + k.replace(/([A-Z])/g, '-$1').toLowerCase() : 'data-none');   // p2Check → data-p2-check
  const q = k => document.querySelectorAll('[' + ATTR(k) + ']');
  const el = n => document.getElementById(P.ids[n]);

  /* ---------------- 静态骨架：只建一次 ---------------- */
  function skeleton() {
    return `
  <div class="task-row" id="${P.ids.tasks}"></div>
  <div class="q-bar" id="${P.ids.q}"><span class="q-tag">${P.emptyTag}</span>${P.emptyText}</div>
  <div class="photo-pair sm" id="${P.ids.photos}"></div>
  <div class="stepcard" id="${P.ids.steps}">${P.steps.map((s, i) =>
    TK.stepRow(i === 0 ? P.badge : '', P.nos[i], s.t, '', s.frames, ATTR(P.cardAttr), i)).join('')}</div>
  <div class="turn-label" id="${P.ids.turn}"></div>
  <div class="teacher-only" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <button class="mega-btn" id="${P.ids.long}">${TK.ICONS.timer} ${P.longLabel}</button>
    <button class="mega-btn mustard" id="${P.ids.follow}">${TK.ICONS.timer} ${P.followLabel}</button>
    <button class="ghost-btn" id="${P.ids.sw}">${P.switchLabel}</button>
    <button class="ghost-btn" id="${P.ids.reset}">${P.resetLabel}</button>
  </div>
  <div class="sentence" id="${P.ids.followQ}" style="display:none"></div>
  <div id="${P.ids.result}" class="big-sub"></div>
  <div class="score-team teacher-only" id="${P.ids.scoreRow}" style="display:none">
    ${P.scoreButtons.map(b => `<button class="${b.team === 'A' ? 'a' : 'b'}" ${ATTR(P.scoreAttr)}="${b.team}">${b.label}</button>`).join('')}
  </div>
  <div class="rule-line">${P.rule}</div>`;
  }

  /* ---------------- 纯渲染：幂等，不重置滚动 ---------------- */
  function render() {
    if (!S) return;
    const task = S.task === null ? null : P.tasks[S.task];
    el('tasks').innerHTML = P.tasks.map((t, i) =>
      `<button class="task-btn${S.task === i ? ' cur' : ''}" ${ATTR(P.taskAttr)}="${i}">${t.name}</button>`).join('');
    q(P.taskAttr).forEach(b => b.onclick = () => pick(+b.dataset[P.taskAttr]));
    el('q').innerHTML = task === null
      ? `<span class="q-tag">${P.emptyTag}</span>${P.emptyText}`
      : `<span class="q-tag">${task.name} · ${task.note}</span>${task.q}`;
    el('photos').innerHTML = task === null ? '' : task.photos.map((k, i) =>
      `<div class="ph"><img src="${TK.img(k)}" alt=""><span class="ph-tag">${P.photoTags[i]}</span></div>`).join('');
    const tl = el('turn');
    tl.textContent = `${P.turnPrefix}${S.turn}`;
    tl.style.color = S.turn === 'A' ? 'var(--teal)' : 'var(--terra-ink)';
    q(P.cardAttr).forEach(b => {
      const i = +b.dataset[P.cardAttr];
      b.classList.toggle('on', S.checks[i]);
      b.disabled = S.done || S.checks[i];
      b.textContent = S.checks[i] ? '已打勾' : '打勾';
      /* 观众屏不显示按钮，改显示状态标记 */
      const st = b.parentElement && b.parentElement.querySelector('.check-state');
      if (st) st.textContent = S.checks[i] ? '✓' : '';
    });
    const fq = el('followQ');
    const showF = S.follow && task !== null;
    fq.style.display = showF ? 'block' : 'none';
    fq.textContent = showF ? task.follow : '';
    el('scoreRow').style.display = S.follow ? 'flex' : 'none';
    el('result').innerHTML = S.done ? `<b>${P.doneText}</b> Team ${S.turn} +${P.doneScore}` : '';
  }

  const emit = () => TK.broadcast({ t: P.msg, s: mod.snapshot() });

  /* ---------------- 本地动作：执行一次 + 广播一次 ---------------- */
  function pick(i) {
    S.task = i; S.checks = [false, false, false]; S.follow = false; S.done = false;
    render(); TK.sfx.click(); emit();
  }

  function check(i) {
    if (S.task === null || S.done || S.checks[i]) return;
    S.checks[i] = true;
    if (S.checks.every(Boolean)) {
      S.done = true;
      TK.score(P.step, S.turn, P.doneScore);
      TK.celebrate();
    }
    render(); TK.sfx.draw(); emit();
  }

  function follow() {
    if (S.task === null) return;
    S.follow = !S.follow;
    if (S.follow) TK.timer(P.followSec, true);
    render(); TK.sfx.click(); emit();
  }

  function flip() {
    S.turn = S.turn === 'A' ? 'B' : 'A';
    render(); TK.sfx.click(); emit();
  }

  function reset() {
    S.checks = [false, false, false]; S.follow = false; S.done = false;
    render(); TK.sfx.click(); emit();
  }

  function applySnap(s) {
    if (!s) return;
    S.task = (s.task === undefined ? null : s.task);
    S.checks = (s.checks || [false, false, false]).slice();
    S.follow = !!s.follow;
    S.done = !!s.done;
    S.turn = s.turn || 'A';
    render();
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;      // 计分要落在这一环节的台账栏上
      S = { task: null, checks: [false, false, false], follow: false, done: false, turn: 'A' };
      return S;
    },

    mount(h, step, practice) {
      P = practice; P.step = step.id;
      h.insertAdjacentHTML('afterbegin', skeleton());
      el('long').onclick = () => TK.timer(P.longSec, true);
      el('follow').onclick = follow;
      el('sw').onclick = flip;
      el('reset').onclick = reset;
      q(P.cardAttr).forEach(b => b.onclick = () => check(+b.dataset[P.cardAttr]));
      q(P.scoreAttr).forEach(b => b.onclick = () => {
        TK.score(step.id, b.dataset[P.scoreAttr], 1); TK.sfx.draw();
      });
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg, m => applySnap(m.s));
    },

    render,
    actions: {},
    snapshot: () => ({ task: S.task, checks: S.checks.slice(), follow: S.follow, done: S.done, turn: S.turn }),
    reset(state) { S = state; return S; },
  };

  TK.registerModule(NAME, mod);
})();

/* modules/photo-relay.js —— PET Part 2「照片描述接龙」
 *
 * 逐字照搬 PET-L4 里「3 Part 2 · Photo 描述接龙」那一段的实现：
 *   加一句 → 该组 +1 并自动换手；Skip → 不得分换手；Switch Photo → 换图；1-min 计时。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 * 铁律：本地动作执行一次 + 广播一次；收到广播只套用状态，不再本地计分。
 */
(function () {
  const NAME = 'photo-relay';
  let P = null, S = null;
  const el = n => document.getElementById(P.ids[n]);

  function skeleton() {
    return `
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center" class="teacher-only">
    <button class="mega-btn" id="${P.ids.add}">${P.addLabel}</button>
    <button class="ghost-btn" id="${P.ids.skip}">${P.skipLabel}</button>
    <button class="ghost-btn" id="${P.ids.sw}">${P.switchLabel}</button>
    <button class="ghost-btn" id="${P.ids.timer}">${TK.ICONS.timer} ${P.timerLabel}</button>
  </div>
  <div class="media-split">
    <img id="${P.ids.photo}" alt="">
    <div class="media-side">
      <div class="big-sub" id="${P.ids.label}"></div>
      ${(P.chips || []).map(row => `<div class="reminder-chips">${row.map(c => `<span>${c}</span>`).join('')}</div>`).join('')}
      <div class="turn-label" id="${P.ids.turn}"></div>
    </div>
  </div>
  <div class="rule-line">${P.rule}</div>`;
  }

  function render() {
    if (!S) return;
    const ph = P.photos[S.idx];
    if (ph) {
      el('photo').src = TK.img(ph.key);
      el('label').textContent = ph.label;
    }
    const t = el('turn');
    t.textContent = `${P.turnPrefix}${S.turn}${P.turnSuffix}`;
    t.style.color = S.turn === 'A' ? 'var(--teal)' : 'var(--terra-ink)';
  }

  const emit = t => TK.broadcast({ t, ...(t === P.msg.switch ? { idx: S.idx } : { turn: S.turn }) });

  function sw() {
    S.idx = (S.idx + 1) % P.photos.length;
    render(); TK.sfx.click(); emit(P.msg.switch);
  }
  function add() {
    TK.score(P.step, S.turn, P.stepScore);
    S.turn = S.turn === 'A' ? 'B' : 'A';
    render(); TK.sfx.draw(); emit(P.msg.add);
  }
  function skip() {
    S.turn = S.turn === 'A' ? 'B' : 'A';
    render(); TK.sfx.click(); emit(P.msg.skip);
  }

  function applySnap(s) {
    if (!s) return;
    if (s.idx !== undefined) S.idx = s.idx || 0;
    if (s.turn !== undefined) S.turn = s.turn || 'A';
    render();
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { idx: 0, turn: 'A' };
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      h.insertAdjacentHTML('afterbegin', skeleton());
      el('add').onclick = add;
      el('skip').onclick = skip;
      el('sw').onclick = sw;
      el('timer').onclick = () => TK.timer(P.timerSec, true);
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg.switch, m => applySnap({ idx: m.idx }));
      TK.on(P.msg.add, m => applySnap({ turn: m.turn }));
      TK.on(P.msg.skip, m => applySnap({ turn: m.turn }));
    },
    render,
    actions: {},
    snapshot: () => ({ idx: S.idx, turn: S.turn }),
    reset(state) { S = state || { idx: 0, turn: 'A' }; return S; },
  };
  TK.registerModule(NAME, mod);
})();

/* modules/tool-pager.js —— KET「Sentence Bank 句型库」（自带页号的翻页教学）
 *
 * 为什么不复用 teach-deck：这一环跟讲义分页同源但差异大到不值得硬合（已记进 pitfalls §一）——
 *   ① 页号 / 总页数 / 上一页下一页是它自己的（`#toolInd` / `toolPrev` / `toolNext`，同步动作是 `toolPage`）
 *   ② 每页内容不是通用 block，而是「五个场所卡 + 句型 ul + scaffold 提示 + 听力页」四种零件
 *   ③ 听力页要联动播放器（翻走这一页自动停），而讲义分页没有这个概念
 *   ④ 支持 ← → 方向键翻页
 * 逐字照搬 KET-U7L3「2 句型库」那一段。
 *
 * 契约三件套：render / actions / snapshot / init（+ mount 挂载钩子）
 */
(function () {
  const NAME = 'tool-pager';
  let P = null, S = null, pics = null, audioCtl = null;
  const el = n => document.getElementById(P.ids[n]);
  const PIC = k => `<img class="picimg" src="${TK.img(k)}" alt="">`;

  function skeleton() {
    return `
  <div class="tool-page-tag teacher-only" id="${P.ids.tag}"></div>
  <div class="flash-grid" id="${P.ids.pics}" style="display:none;max-width:760px"></div>
  <ul class="tool-frames" id="${P.ids.frames}"></ul>
  <div id="${P.ids.audioSlot}"></div>
  <div class="scaffold" id="${P.ids.hint}"></div>
  <div class="deck-nav">
    <button class="ghost-btn" id="${P.ids.prev}">${P.prevLabel}</button>
    <span class="page-ind" id="${P.ids.ind}"></span>
    <button class="ghost-btn" id="${P.ids.next}">${P.nextLabel}</button>
  </div>
  <div class="rule-line">${P.rule}</div>`;
  }

  function buildPics() {
    pics = el('pics');
    pics.innerHTML = '';
    P.places.forEach(p => {
      const d = document.createElement('div');
      d.className = 'flash-card static';
      d.innerHTML = `<span class="pic">${PIC(p.svg)}</span><div class="name">${p.name}</div>`;
      pics.appendChild(d);
    });
  }

  /* 与迁移前同一套副作用：切页时若离开听力页就停播；方向键也翻页 */
  function page(n, quiet) {
    S.page = Math.max(0, Math.min(P.pages.length - 1, n));
    const p = P.pages[S.page];
    el('tag').textContent = P.tagPrefix.replace('{n}', S.page + 1).replace('{t}', p.title);
    pics.style.display = p.pics ? 'grid' : 'none';
    el('frames').innerHTML = p.frames.map(f => `<li>${f}</li>`).join('');
    el('hint').innerHTML = p.hint;
    if (audioCtl) {
      audioCtl.show(!!p.audio);
      if (!p.audio) audioCtl.pause();            // 翻离听力页就停，别继续放
    }
    el('ind').textContent = `${S.page + 1} / ${P.pages.length}`;
    if (!TK.isAudience) TK.sfx.draw();
    if (!quiet) TK.broadcast({ t: P.msg, n: S.page });
  }

  const mod = {
    init(step, practice) {
      P = practice; P.step = step.id;
      S = { page: 0 };
      return S;
    },
    mount(h, step, practice) {
      P = practice; P.step = step.id;
      S = S || { page: 0 };
      h.insertAdjacentHTML('afterbegin', skeleton());
      buildPics();
      /* 听力播放器：挂进本页的 slot（观众屏不建，播放器模块自己会跳过） */
      const ap = TK.modules[P.audioModule];
      if (ap && !TK.isAudience) {
        ap.mount(el('audioSlot'), step, { ...P.audio });
        audioCtl = ap.ctl;
      }
      el('prev').onclick = () => page(S.page - 1, false);
      el('next').onclick = () => page(S.page + 1, false);
      document.addEventListener('keydown', e => {
        if (TK.cur() !== step.id || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
        if (e.key === 'ArrowRight') page(S.page + 1, false);
        if (e.key === 'ArrowLeft') page(S.page - 1, false);
      });
      TK.snapshotPart(P.snapKey, mod.snapshot);
      TK.applyPart(P.snapKey, applySnap);
      TK.on(P.msg, m => page(m.n, true));
      page(0, true);
    },
    render() { page(S ? S.page : 0, true); },
    actions: {},
    snapshot: () => S.page,                        // 与迁移前一致：toolPage 是个数字
    reset(state) { S = { page: 0 }; page(0, true); return S; },
  };

  function applySnap(n) { page(n || 0, true); }

  TK.registerModule(NAME, mod);
})();

function beep(freq=880, dur=.15, type='sine', vol=.22) {
  if (!soundOn) return;
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+dur);
    o.start(); o.stop(ctx.currentTime+dur);
  } catch(e){}
}

const cvs = document.getElementById('confetti');
function celebrate() {
  const ctx = cvs.getContext('2d');
  cvs.width = innerWidth; cvs.height = innerHeight;
  cvs.style.display = 'block';
  const colors = ['#2C786C','#D96C4F','#E0A82E','#6BCB77','#FF8A5C'];
  const parts = Array.from({length:120}, () => ({
    x: Math.random()*cvs.width, y: -20 - Math.random()*cvs.height*.5,
    w: 8+Math.random()*8, h: 6+Math.random()*6,
    c: rnd(colors), vy: 3+Math.random()*4, vx: -2+Math.random()*4,
    r: Math.random()*Math.PI, vr: -.1+Math.random()*.2,
  }));
  const t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    parts.forEach(p => {
      p.y += p.vy; p.x += p.vx; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if (t - t0 < 1800) requestAnimationFrame(frame);
    else cvs.style.display = 'none';
  })(t0);
  sfx.win();
}

  if (!t) return;

  tLeft = t.left != null ? t.left : tLeft;

  if (ticking) return;

      document.getElementById('tPresets').style.display = 'none';

/* ================= 左侧操作区等比缩放（控制台不受影响） ================= */
let uiZoom = parseFloat(store.get(KEY('_zoom')) || '1');
store.set(KEY('_zoom'), '1');
if (!(uiZoom >= 0.5 && uiZoom <= 1.6)) uiZoom = 1;
if (uiZoom < 0.8) uiZoom = 1;
let sessionMinZoom = 1;      // 本场自动适配的基准：只降不升，避免按钮忽大忽小
function leftEls() {
  return [document.querySelector('header'), document.querySelector('.steps'), document.querySelector('main')];
}
function setZoom(z, persist) {
  uiZoom = Math.min(1.6, Math.max(0.45, Math.round(z * 100) / 100));
  const presenting = document.body.classList.contains('presenting');
  leftEls().forEach(el => { if (el) el.style.zoom = presenting ? uiZoom : ''; });
  const lbl = document.getElementById('zoomLabel');
  if (lbl) lbl.textContent = Math.round(uiZoom * 100) + '%';
  if (persist !== false) store.set(KEY('_zoom'), String(uiZoom));
}
function resetZoom() { leftEls().forEach(el => { if (el) el.style.zoom = ''; }); }
function measureWorstScreenH() {          // 需在 zoom=1 状态下调用；量完立即恢复，不改显示
  // 每个环节「讲解」「练习」是两种视图，同一时刻只显示一种：分别量，取更大的那个，
  // 这样切换时缩放不会跳，也不会被两页叠在一起的高度误伤。
  const screens = [...document.querySelectorAll('.screen')];
  const modsAll = screens.map(el => [...el.querySelectorAll('.mod-view')]);
  const savedOn = modsAll.map(list => list.map(v => v.classList.contains('on')));
  // 讲义是分页的：只显示「当前那一页」，所以只量当前页会把最差的那一页漏掉（实测漏掉过
  // 1264px 与 762px 的差），缩放因此偏乐观、翻到那一页就冲出屏幕。这里把每一页都量一遍，
  // 取所有页里的最大高度。—— 仍然在正常流里量（不用 absolute），量完逐页还原。
  const decks = [...document.querySelectorAll('.lesson-deck')];
  const savedPageOn = decks.map(root => [...root.querySelectorAll('.deck-page')].map(p => p.classList.contains('on')));
  let max = 0;
  function measureAllPages() {
    decks.forEach(root => {
      const pages = [...root.querySelectorAll('.deck-page')];
      pages.forEach(p => {
        // 一次只让一页显示：否则第 1 页和当前页会同时 'on'、两页叠起来量，高度虚高
        // （第一版就是这么写的，量虚了 40%，缩放被压到下限 0.55，投影正文掉到 18px）
        pages.forEach(q => q.classList.remove('on'));
        p.classList.add('on');
        void document.body.offsetHeight;             // 强制同步重排后再量
        max = Math.max(max, root.closest('.screen').scrollHeight);
      });
    });
  }
  screens.forEach((el, si) => {
    const list = modsAll[si];
    const variants = list.length ? list.map((_, i) => i) : [-1];
    variants.forEach(k => {
      list.forEach((v, i) => v.classList.toggle('on', i === k));
      if (el.classList.contains('on')) {
        max = Math.max(max, el.scrollHeight);
        measureAllPages();                            // 这一屏的每一页讲义都量一遍
        return;
      }
      const saved = el.getAttribute('style') || '';
      // 关键：不能用 position:absolute + width:100% 量——绝对定位会脱离 main，宽度按视口算，
      // 而真实环节宽度是 main 的内容宽度（max-width:1100）。宽度算宽了，高度就量矮了，缩放必然偏乐观。
      el.setAttribute('style', 'display:block;visibility:hidden;');
      max = Math.max(max, el.scrollHeight);
      measureAllPages();
      if (saved) el.setAttribute('style', saved); else el.removeAttribute('style');
    });
  });
  screens.forEach((el, si) => modsAll[si].forEach((v, i) => v.classList.toggle('on', savedOn[si][i])));
  decks.forEach((root, di) => [...root.querySelectorAll('.deck-page')].forEach((p, i) => p.classList.toggle('on', savedPageOn[di][i])));
  return max;
}
function computeFitZoom() {
  // 全程同步：清零 → 测量 → 计算 → 设回，浏览器只绘制最终结果，不会闪
  leftEls().forEach(el => { if (el) el.style.zoom = ''; });
  const header = document.querySelector('header');
  const steps = document.querySelector('.steps');
  const chromeH = (header ? header.offsetHeight : 0) + (steps ? steps.offsetHeight : 0) + 76;
  const naturalH = measureWorstScreenH() + chromeH;
  const zH = (window.innerHeight - 8) / Math.max(naturalH, 1);
  return Math.round(Math.max(0.55, Math.min(1, zH)) * 100) / 100;
}
function fitLeft(allowGrow) {
  if (!document.body.classList.contains('presenting')) { resetZoom(); return; }
  const z = computeFitZoom();
  if (allowGrow) sessionMinZoom = z;
  else sessionMinZoom = Math.min(sessionMinZoom, z);
  setZoom(sessionMinZoom);
}
document.getElementById('zoomOut').onclick = () => { const v = Math.round((uiZoom - 0.05) * 100) / 100; sessionMinZoom = v; setZoom(v); };
document.getElementById('zoomIn').onclick = () => { const v = Math.round((uiZoom + 0.05) * 100) / 100; sessionMinZoom = v; setZoom(v); };
document.getElementById('zoomFit').onclick = () => { sessionMinZoom = 1; fitLeft(true); };
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === '0' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sessionMinZoom = 1; setZoom(1); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!document.body.classList.contains('presenting')) return;
  if (e.key === '-' || e.key === '_') { const v = Math.round((uiZoom - 0.05) * 100) / 100; sessionMinZoom = v; setZoom(v); }
  if (e.key === '=' || e.key === '+') { const v = Math.round((uiZoom + 0.05) * 100) / 100; sessionMinZoom = v; setZoom(v); }
});
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (document.body.classList.contains('presenting')) fitLeft(true); }, 250);
});

/* ================= 观众屏自动适应窗口（投影不滚动） ================= */
let audFitTimer = null;
let audZoomApplied = 0, audSig = '', audDone = false;
function scheduleAudFit(delay, force) {    // 观众屏重算缩放的唯一入口：收消息 / resize / 轮询 / 图片加载完都走这里
  if (!isAudience) return;                 // 教师端不需要（教师端走 fitLeft）
  clearTimeout(audFitTimer);
  audFitTimer = setTimeout(() => fitAudience(!!force), delay || 90);
}
function audUsed() {                        // 真正会造成滚动的视觉高度：main 的底边
  const m = document.querySelector('main');
  if (!m) return { h: 0, w: 0 };
  const r = m.getBoundingClientRect();
  return { h: r.bottom, w: r.width };
}
function fitAudience(force) {
  if (!isAudience) return;
  const sig = JSON.stringify([cur, Object.values(modState).join(''), deckState, PARTS.map(p => p.get && p.get()), refOpen, refTab]);
  if (!force && audDone && sig === audSig) return;
  audSig = sig; audDone = true;
  const mainEl = document.querySelector('main');
  if (!mainEl) return;
  document.documentElement.style.zoom = '';  // 旧版本给根元素加过缩放，清掉
  mainEl.style.zoom = '';                    // 同帧清零测量
  const header = document.querySelector('header');
  const fb = document.getElementById('frameBar');
  const cs = getComputedStyle(mainEl);
  const chromeH = (header ? header.offsetHeight : 0) + (fb ? fb.offsetHeight : 0) + (parseFloat(cs.paddingBottom) || 0);
  const naturalH = measureWorstScreenH() + chromeH;
  const vh = window.innerHeight;
  // 宽度不用管：观众屏的 main 是 max-width:none; width:100%，缩放多少都铺满整屏（和教师端同一套几何）。
  // 只按高度定比例，且上限 1 —— 放大反而会把版面挤窄、变高，得不偿失。
  let z = naturalH > 40 ? Math.min(1, (vh - 8) / naturalH) : 1;
  z = Math.max(0.55, Math.round(z * 100) / 100);
  if (!force && audZoomApplied && z > audZoomApplied) z = audZoomApplied;  // 收消息时只降不升，尺寸稳定
  mainEl.style.zoom = z;
  // 自校正：解析公式会偏乐观（chrome 高度估不准），直接量 main 底边，还溢出就按比例再缩，最多 3 轮
  for (let i = 0; i < 3; i++) {
    const u = audUsed();
    if (u.h <= vh) break;
    const nz = Math.max(0.55, Math.round((z * (vh / Math.max(u.h, 1))) * 100) / 100 - 0.01);
    if (nz >= z) break;                      // 缩不动了，退出，避免死循环
    z = nz;
    mainEl.style.zoom = z;
  }
  audZoomApplied = z;
}
window.addEventListener('resize', () => scheduleAudFit(0, true));
window.addEventListener('load', () => scheduleAudFit(0, true));   // 图片有真实高度后再定一次，否则量出来偏矮

/* ================= 状态快照与重放（模块状态走注册表） ================= */
function snapshot() {
  const m = {
    t:'state', id: cur, ledger, mod: { ...modState }, deck: { ...deckState }, champ: champAnnounced,
    ref: {open: refOpen, tab: refTab},
    timer: timerState(),
  };
  PARTS.forEach(p => { if (p.get) m[p.key] = p.get(); });
  return m;
}
function applyState(m) {
  ledger = m.ledger || ledger; renderScore();
  doGo(m.id || 'home', false);
  if (m.mod) Object.keys(m.mod).forEach(k => doMod(k, m.mod[k], false));
  if (m.deck) Object.keys(m.deck).forEach(k => doDeck(k, m.deck[k], false));
  PARTS.forEach(p => { if (p.apply && m[p.key] !== undefined) p.apply(m[p.key]); });
  applyTimer(m.timer);
  if (m.ref && (m.ref.open !== refOpen || m.ref.tab !== refTab)) doRef(m.ref.open, m.ref.tab, false);
  if (m.champ !== undefined) champAnnounced = !!m.champ;
  if (cur === 'champion') renderChampion();
}
function setLedger(l) { ledger = l || ledger; renderScore(); if (cur === 'champion') renderChampion(); }

/* ================= 同步分发 ================= */
let pingCount = 0;
let lastAckAt = Date.now(), lastResendAt = 0;
function handlePingAck(m) {
  const now = Date.now();
  if (m.t === 'ping') {
    lastHeartbeat = now; lastAckAt = now;
    send(snapshot());
    setStatus('ok', '已同步');
  } else if (m.t === 'ack') {
    lastHeartbeat = now; lastAckAt = now;
    // 这里绝对不能补发！补发会产生新的 _id，下一个 ack 必然又对不上 → 自激风暴（实测 38 秒发出 8 万条快照）
    if (m.last && lastSentId && m.last !== lastSentId) setStatus('wait', '同步中…');
    else setStatus('ok', '已同步');
  }
}
// 兜底：真的超过 3 秒收不到任何 ack 才补发一次完整快照（限流 2 秒）
setInterval(() => {
  if (isAudience) return;
  const now = Date.now();
  if (now - lastAckAt > 3000 && now - lastResendAt > 2000) { lastResendAt = now; send(snapshot()); }
}, 1000);
/* 同步动作注册表：外壳的通用动作 + 模块用 TK.on() 注册的动作（ACT 已声明在外壳顶部） */
Object.assign(ACT, {
  go: m => doGo(m.id, false),
  score: m => setLedger(m.ledger),
  mod: m => doMod(m.id, m.v, false),
  deck: m => TD ? TD.actions.deck(m) : doDeck(m.id, m.i, false),
  timer: m => doTimer(m.sec, m.auto, false),
  timerCtl: m => {
    if (m.act === 'start') startTick();
    else if (m.act === 'pause') stopTick();
    else if (m.act === 'reset') { stopTick(); tLeft = m.total || tTotal; tRender(); }
    else if (m.act === 'preset') { tTotal = m.total; tLeft = m.left; stopTick(); tRender(); }
    else if (m.act === 'min') overlay.style.display = 'none';
  },
  timerClose: () => closeTimer(false),
  champGo: () => doChampGo(false),
  ref: m => doRef(m.open, m.tab, false),
  bye: () => document.body.classList.add('bye'),
  state: m => applyState(m),
});
if (bc) bc.onmessage = e => {
  const m = e.data;
  if (dup(m)) return;
  if (isAudience) {
    document.body.classList.remove('bye');
    if (ACT[m.t]) ACT[m.t](m);
    scheduleAudFit();
    send2({t:'ack', last: m ? m._id : null});
  } else handlePingAck(m);
};
window.addEventListener('storage', e => {
  if (!e.newValue) return;
  try {
    const m = JSON.parse(e.newValue);
    if (dup(m)) return;
    if (e.key === KEY('-msg') && isAudience) {
      document.body.classList.remove('bye');
      if (ACT[m.t]) ACT[m.t](m);
      scheduleAudFit();
      send2({t:'ack', last: m ? m._id : null});
    } else if (e.key === KEY('-aud') && !isAudience) {
      handlePingAck(m);
    }
  } catch(err){}
});

/* ===== 轮询兜底（Safari 兼容）：即使 BC 和 storage 事件都不可用，也能同步 ===== */
let inboxAud = store.get(KEY('-aud')), inboxMsg = store.get(KEY('-msg'));
function pollInbox() {
  if (isAudience) {
    const v = store.get(KEY('-msg'));
    if (v && v !== inboxMsg) {
      inboxMsg = v;
      try {
        const m = JSON.parse(v);
        if (!dup(m)) {
          document.body.classList.remove('bye');
          if (ACT[m.t]) ACT[m.t](m);
          scheduleAudFit();
          send2({t:'ack', last: m._id});
        }
      } catch(e){}
    }
  } else {
    const v = store.get(KEY('-aud'));
    if (v && v !== inboxAud) {
      inboxAud = v;
      try {
        const m = JSON.parse(v);
        if (!dup(m)) handlePingAck(m);
      } catch(e){}
    }
  }
}
window.addEventListener('hashchange', () => {
  if (isAudience) return;
  const want = location.hash.includes('present');
  const on = document.body.classList.contains('presenting');
  if (want && !on) { enterPresenting(); }
  else if (!want && on) { exitPresenting(); }
});
if (!isAudience && location.hash.includes('present')) {
  setTimeout(() => {
    document.body.classList.add('presenting');
    setStatus('wait', '未打开（点「打开观众屏」或用复制地址）');
    updateConsole();
    setTimeout(() => { sessionMinZoom = 1; fitLeft(true); }, 200);
  }, 300);
}
if (isAudience) {
  document.body.classList.add('audience');
  setTimeout(() => fitAudience(true), 400);
  send2({t:'ping'});
  setInterval(() => send2({t:'ping'}), 3000);
}
setInterval(pollInbox, 700);
</script>
